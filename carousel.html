<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>旋轉木馬時鐘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 單人小遊戲：旋轉木馬的頂棚下面是一個大時鐘。讀時鐘＝看鐘選答案；撥時鐘＝拖動長針短針撥到指定時間 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1f2b33; --muted:#5d6b72; --good:#1f9d61; --bad:#d23c3c;
  --accent:#d1478f; --accent-dark:#9c2c69; --gold:#f2b705; --cream:#fff8ec;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 50% 30%,#fff3f8,#ffe0ec 60%,#f9cfe0);color:var(--ink);font-family:var(--text);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  display:flex;flex-direction:column}
[hidden]{display:none!important}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.ibtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.9);font-size:24px;cursor:pointer;
  display:grid;place-items:center;text-decoration:none;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.ibtn:active{transform:translateY(2px)}
.title{justify-self:center;font-weight:800;font-size:clamp(18px,3.2vmin,28px)}
.right{display:flex;gap:10px;align-items:center}
.score{font-family:var(--num);font-weight:800;font-size:clamp(18px,3.2vmin,28px);background:rgba(255,255,255,.9);border-radius:999px;padding:4px 14px;white-space:nowrap}
main{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(10px,3vmin,36px);align-items:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1.25fr) auto}}
/* 旋轉木馬時鐘 */
.ride{height:100%;min-height:0;display:grid;place-items:center}
.ride svg{width:100%;height:100%;max-height:100%;overflow:visible;touch-action:none}
.hand{cursor:grab}
.hand.drag{cursor:grabbing}
.setmode .hand .grip{fill:rgba(209,71,143,.001)}
.horse{animation:bob 1.6s ease-in-out infinite}
.horse:nth-of-type(2n){animation-delay:-.8s}
@keyframes bob{50%{transform:translateY(-10px)}}
.spin .horse{animation-duration:.4s}
.spin .bulb{animation:blink .25s steps(1) infinite}
.bulb{fill:#fff3b0}
@keyframes blink{50%{fill:var(--gold)}}
.canopy-stripes{transform-origin:200px 70px}
.spin .canopy-stripes{animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{25%{transform:skewX(4deg)}75%{transform:skewX(-4deg)}}
/* 右邊：題目與作答 */
.panel{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,18px);text-align:center;min-width:0}
.ask{font-size:clamp(20px,3.6vmin,32px);font-weight:800;line-height:1.4}
.ask b{font-family:var(--num),var(--text);color:var(--accent);font-size:1.3em;white-space:nowrap}
.hint{font-size:clamp(14px,2.2vmin,18px);color:var(--muted);line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.6vmin,14px);width:min(100%,520px)}
.ch{font-family:var(--num),var(--text);font-weight:800;font-size:clamp(22px,4.2vmin,40px);border:0;border-radius:18px;padding:.45em .3em;
  background:#fff;color:var(--ink);box-shadow:0 5px 0 #e9b9cf;cursor:pointer;white-space:nowrap}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #e9b9cf}
.ch.wrong{background:var(--bad);color:#fff;animation:shake .35s}
.ch.right{background:var(--good);color:#fff}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
.adj{display:grid;grid-template-columns:auto auto auto;gap:8px 10px;align-items:center;font-weight:800;font-size:clamp(15px,2.4vmin,20px)}
.adj button{width:52px;height:46px;border-radius:14px;border:0;background:#fff;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #e9b9cf;color:var(--ink)}
.adj button:active{transform:translateY(2px)}
.now{font-family:var(--num),var(--text);font-weight:800;font-size:clamp(20px,3.4vmin,30px);color:var(--muted)}
.big{font-family:var(--text);font-weight:800;font-size:clamp(20px,4vmin,30px);border:0;border-radius:999px;padding:.45em 1.6em;
  background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--accent-dark);text-decoration:none;display:inline-block}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark)}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfd8dc;border:2px solid #cfd8dc}
.msg{min-height:1.4em;font-size:clamp(18px,3.2vmin,28px);font-weight:800}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
/* 開始／結束畫面 */
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,224,236,.85);padding:16px;z-index:5;overflow:auto}
.box{background:#fff;border-radius:24px;padding:clamp(18px,4vmin,32px);width:min(500px,100%);box-shadow:0 12px 40px rgba(0,0,0,.18);
  display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.box h2{margin:0;font-size:clamp(26px,5.5vmin,42px)}
.box p{margin:0;color:var(--muted);font-size:clamp(15px,2.5vmin,19px);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lbl{font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}
.opt{font:inherit;font-size:17px;font-weight:700;border:2px solid #cfd8dc;background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer;color:inherit}
.opt small{display:block;font-size:12px;font-weight:600;opacity:.75}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.stars{font-size:clamp(40px,9vmin,72px);letter-spacing:.1em;line-height:1}
</style>
</head>
<body>
<header class="top">
  <a class="ibtn" href="./" aria-label="回遊樂園地圖">🏠</a>
  <div class="title">🎠 旋轉木馬時鐘</div>
  <div class="right"><span class="score" id="score">⭐ 0</span><button type="button" class="ibtn" id="again" aria-label="再念一次題目">🔊</button></div>
</header>
<main id="main">
  <div class="ride" id="ride">
    <svg id="clock" viewBox="0 0 400 470" role="img" aria-label="旋轉木馬時鐘">
      <!-- 頂棚 -->
      <g class="canopy-stripes">
        <path d="M200 8 L370 96 L30 96 Z" fill="#fff"/>
        <path d="M200 8 L30 96 L64 96 Z M200 8 L98 96 L132 96 Z M200 8 L166 96 L200 96 Z M200 8 L234 96 L268 96 Z M200 8 L302 96 L336 96 Z" fill="#d1478f"/>
        <path d="M200 8 L64 96 L98 96 Z M200 8 L132 96 L166 96 Z M200 8 L200 96 L234 96 Z M200 8 L268 96 L302 96 Z M200 8 L336 96 L370 96 Z" fill="#7ac6e8"/>
      </g>
      <path d="M200 8 L200 -14" stroke="#9c2c69" stroke-width="3"/><path d="M200 -14 L224 -7 L200 0 Z" fill="#f2b705"/>
      <path d="M26 96 Q47 116 68 96 Q89 116 110 96 Q131 116 152 96 Q173 116 194 96 Q215 116 236 96 Q257 116 278 96 Q299 116 320 96 Q341 116 362 96 Q368 106 374 96 L374 92 L26 92 Z" fill="#f2b705"/>
      <!-- 柱子 -->
      <rect x="44" y="110" width="8" height="330" rx="4" fill="#f2b705"/><rect x="348" y="110" width="8" height="330" rx="4" fill="#f2b705"/>
      <!-- 時鐘外圈與燈泡 -->
      <circle cx="200" cy="282" r="150" fill="#9c2c69"/>
      <circle cx="200" cy="282" r="138" fill="var(--cream)" stroke="#f2b705" stroke-width="6"/>
      <g id="bulbs"></g>
      <g id="ticks"></g>
      <g id="nums" font-family="Baloo 2, Arial Rounded MT Bold, sans-serif" font-weight="800" font-size="30" fill="#1f2b33" text-anchor="middle" dominant-baseline="central"></g>
      <!-- 時針（短、粗）與分針（長、細） -->
      <g class="hand" id="hourHand">
        <line class="grip" x1="200" y1="282" x2="200" y2="200" stroke="transparent" stroke-width="44" stroke-linecap="round"/>
        <line x1="200" y1="296" x2="200" y2="212" stroke="#1f2b33" stroke-width="12" stroke-linecap="round"/>
      </g>
      <g class="hand" id="minHand">
        <line class="grip" x1="200" y1="282" x2="200" y2="160" stroke="transparent" stroke-width="40" stroke-linecap="round"/>
        <line x1="200" y1="300" x2="200" y2="160" stroke="#d1478f" stroke-width="7" stroke-linecap="round"/>
      </g>
      <circle cx="200" cy="282" r="10" fill="#f2b705" stroke="#1f2b33" stroke-width="3"/>
      <!-- 木馬 -->
      <text class="horse" x="34" y="452" font-size="62" text-anchor="middle">🎠</text>
      <text class="horse" x="366" y="452" font-size="62" text-anchor="middle">🎠</text>
      <path d="M20 440 L380 440 L392 462 L8 462 Z" fill="#d1478f"/>
    </svg>
  </div>
  <div class="panel" id="panel">
    <div class="ask" id="ask"></div>
    <div class="choices" id="choices" hidden></div>
    <div id="setter" hidden style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div class="now" id="now"></div>
      <div class="adj">
        <button type="button" id="hMinus" aria-label="時針往回">−</button><span>時（短針）</span><button type="button" id="hPlus" aria-label="時針往前">＋</button>
        <button type="button" id="mMinus" aria-label="分針往回">−</button><span>分（長針）</span><button type="button" id="mPlus" aria-label="分針往前">＋</button>
      </div>
      <button type="button" class="big" id="check">撥好了！</button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="hint" id="hint">短針是時針、長針是分針</div>
  </div>

  <section class="cover" id="start">
    <div class="box">
      <h2>🎠 旋轉木馬時鐘</h2>
      <p>旋轉木馬上有一個大時鐘！<br>看時鐘說出時間，或把時鐘撥到對的時間。</p>
      <span class="lbl">玩法</span>
      <div class="row" id="modes">
        <button type="button" class="opt" data-mode="read">讀時鐘<small>看鐘選答案</small></button>
        <button type="button" class="opt" data-mode="set">撥時鐘<small>拖動指針</small></button>
        <button type="button" class="opt" data-mode="mix">兩種混合</button>
      </div>
      <span class="lbl">難度</span>
      <div class="row" id="levels">
        <button type="button" class="opt" data-lv="1">初級<small>幾點、幾點半</small></button>
        <button type="button" class="opt" data-lv="2">進階<small>幾點幾分（5 分）</small></button>
        <button type="button" class="opt" data-lv="3">高級<small>幾點幾分（1 分）</small></button>
      </div>
      <button type="button" class="big" id="go">開始！</button>
    </div>
  </section>
  <section class="cover" id="end" hidden>
    <div class="box">
      <div class="stars" id="stars"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="row">
        <button type="button" class="big" id="replay">再玩一次</button>
        <a class="big alt" href="./">回遊樂園</a>
      </div>
    </div>
  </section>
</main>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const STEP={1:30,2:5,3:1};
  const S={lv:[1,2,3].includes(+pref("park-level"))?+pref("park-level"):1,mode:pref("carousel-mode")||"read",total:10,
    round:0,score:0,tries:0,phase:"start",kind:"read",target:null,h:12,m:0,last:""};
  if(!["read","set","mix"].includes(S.mode))S.mode="read";

  // ---- 開始畫面的選項 ----
  const sync=()=>{
    document.querySelectorAll("#levels button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===S.lv));
    document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  };
  document.querySelectorAll("#levels button").forEach(b=>b.addEventListener("click",()=>{S.lv=+b.dataset.lv;pref("park-level",S.lv);sync()}));
  document.querySelectorAll("#modes button").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.mode;pref("carousel-mode",S.mode);sync()}));
  sync();

  // ---- 畫鐘面 ----
  const NS="http://www.w3.org/2000/svg",CX=200,CY=282;
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return[CX+r*Math.cos(a),CY+r*Math.sin(a)]};
  const mk=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e};
  for(let i=0;i<24;i++){const[x,y]=pt(i*15,144);mk("circle",{cx:x,cy:y,r:4,class:"bulb",style:`animation-delay:${(i%2)*-.12}s`},$("bulbs"))}
  for(let i=0;i<60;i++){const big=i%5===0,[x1,y1]=pt(i*6,big?118:124),[x2,y2]=pt(i*6,131);
    mk("line",{x1,y1,x2,y2,stroke:"#1f2b33","stroke-width":big?4:1.5,"stroke-linecap":"round"},$("ticks"))}
  for(let n=1;n<=12;n++){const[x,y]=pt(n*30,96);mk("text",{x,y},$("nums")).textContent=n}

  function draw(){
    $("hourHand").setAttribute("transform",`rotate(${(S.h%12)*30+S.m*.5} ${CX} ${CY})`);
    $("minHand").setAttribute("transform",`rotate(${S.m*6} ${CX} ${CY})`);
    if(S.kind==="set")$("now").textContent=`現在：${fmt(S.h,S.m)}`;
  }
  const fmt=(h,m)=>m===0?`${h} 點`:(m===30&&S.lv===1)?`${h} 點半`:`${h} 點 ${m} 分`;
  const speak=(h,m)=>m===0?`${h}點`:(m===30&&S.lv===1)?`${h}點半`:`${h}點${m}分`;

  // ---- 語音與音效 ----
  const synth=window.speechSynthesis;let voice=null;const rate=+(pref("duel-rate")||.9)||.9;
  const quality=v=>{const u=v.voiceURI||"";return /eloquence|speech\.synthesis\.voice/i.test(u)?0:/\.premium\./i.test(u)?3:/enhanced|-premium/i.test(u)?2:1};
  function pickVoice(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));const want=pref("duel-voice");
    const tw=vs.filter(v=>/TW|Hant/i.test(v.lang)&&quality(v)>0).sort((a,b)=>quality(b)-quality(a));
    voice=(want&&vs.find(v=>(v.voiceURI||v.name)===want))||tw[0]||vs.find(v=>quality(v)>0)||vs[0]||null}
  if(synth){pickVoice();try{synth.addEventListener("voiceschanged",pickVoice)}catch(e){}}
  function say(t){if(!synth)return;try{const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang.replace("_","-"):"zh-TW";if(voice)u.voice=voice;u.rate=rate;u.pitch=1.1;
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{try{synth.speak(u)}catch(e){}},90)}else synth.speak(u)}catch(e){}}
  let ac=null;
  function tone(fs,dur=.12,type="triangle",vol=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();
    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.7)})}catch(e){}}
  const sfx={good:()=>tone([523,659,784,1047,784,1047],.11,"sine",.18),bad:()=>tone([220,180],.14,"square",.07),click:()=>tone([1200],.03,"square",.03),win:()=>tone([523,659,784,1047],.16)};
  function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}
    try{if(synth&&!synth.speaking){const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}}catch(e){}}

  // ---- 出題 ----
  function newTime(){
    const st=STEP[S.lv];let h,m,k,t=0;
    do{h=rnd(1,12);m=st===30?(Math.random()<.5?0:30):rnd(0,59/st|0)*st;k=h+":"+m}while(k===S.last&&++t<10);
    S.last=k;return{h,m};
  }
  // 讀時鐘的干擾選項：常見的看錯（時針看成下一個鐘點、長短針看反、分針差一格）
  function decoys(h,m){
    const st=STEP[S.lv],out=[],add=(hh,mm)=>{hh=((hh-1+12)%12)+1;mm=((mm%60)+60)%60;
      if(!(hh===h&&mm===m)&&!out.some(o=>o.h===hh&&o.m===mm))out.push({h:hh,m:mm})};
    if(m>=30)add(h+1,m);else add(h-1,m);
    if(m%5===0&&m>0)add(m/5,h*5%60);
    add(h,m+(st===30?30:st===5?5:rnd(1,4)));add(h,m-(st===30?30:st===5?10:rnd(5,9)));
    add(h+1,m);add(h-1,m);add(h,(60-m)%60);
    while(out.length<3)add(rnd(1,12),st===30?rnd(0,1)*30:rnd(0,59/st|0)*st);
    return out.slice(0,3);
  }

  // ---- 遊戲流程 ----
  function start(){
    unlock();$("start").hidden=true;$("end").hidden=true;
    S.round=0;S.score=0;S.last="";upd();next();
    try{navigator.wakeLock?.request("screen").catch(()=>{})}catch(e){}
  }
  const upd=()=>{$("score").textContent=`⭐ ${S.score} / ${S.total}`};
  function next(){
    if(S.round>=S.total)return finish();
    S.round++;S.tries=0;S.phase="play";$("msg").textContent="";$("msg").className="msg";
    S.kind=S.mode==="mix"?(S.round%2?"read":"set"):S.mode;
    S.target=newTime();
    document.body.classList.toggle("setmode",S.kind==="set");
    if(S.kind==="read"){
      S.h=S.target.h;S.m=S.target.m;draw();
      $("ask").innerHTML="旋轉木馬上的時鐘<br>現在是幾點？";
      const list=[S.target,...decoys(S.target.h,S.target.m)].sort(()=>Math.random()-.5);
      $("choices").innerHTML=list.map(t=>`<button type="button" class="ch" data-h="${t.h}" data-m="${t.m}">${fmt(t.h,t.m)}</button>`).join("");
      $("choices").querySelectorAll(".ch").forEach(b=>b.addEventListener("click",()=>pick(b)));
      $("choices").hidden=false;$("setter").hidden=true;
      say("現在是幾點？");
    }else{
      // 起始時間：和答案不一樣
      let s;do{s=newTime()}while(s.h===S.target.h&&s.m===S.target.m);S.h=s.h;S.m=s.m;draw();
      $("ask").innerHTML=`請把時鐘撥到<br><b>${fmt(S.target.h,S.target.m)}</b>`;
      $("choices").hidden=true;$("setter").hidden=false;
      say(`請把時鐘撥到${speak(S.target.h,S.target.m)}`);
    }
  }
  function correct(){
    S.phase="reveal";if(S.tries===0)S.score++;upd();sfx.good();
    $("ride").classList.add("spin");setTimeout(()=>$("ride").classList.remove("spin"),1600);
    $("msg").textContent=["答對了！","好棒！","木馬轉起來囉！"][rnd(0,2)];$("msg").className="msg good";
    say(`答對了，${speak(S.target.h,S.target.m)}`);
    setTimeout(next,2400);
  }
  function wrong(text){
    S.tries++;sfx.bad();$("msg").textContent=text;$("msg").className="msg bad";
  }
  function pick(b){
    if(S.phase!=="play")return;
    if(+b.dataset.h===S.target.h&&+b.dataset.m===S.target.m){b.classList.add("right");correct()}
    else{b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");
      wrong("再看一次：短針指時、長針指分");say("再看一次，短針是時針，長針是分針")}
  }
  $("check").addEventListener("click",()=>{
    if(S.phase!=="play"||S.kind!=="set")return;
    if(S.h%12===S.target.h%12&&S.m===S.target.m)return correct();
    const hOK=S.h%12===S.target.h%12,mOK=S.m===S.target.m;
    const tip=!mOK?`長針（分針）要指到 ${S.target.m===0?"12":S.target.m%5===0?"數字 "+S.target.m/5:S.target.m+" 分的位置"}`
      :"短針（時針）的位置再看一下";
    wrong(tip);say(tip.replace(/（|）/g,""));
    // 錯兩次就示範一次
    if(S.tries>=2){S.phase="reveal";setTimeout(()=>{animateTo(S.target.h,S.target.m);$("msg").textContent=`看，這就是 ${fmt(S.target.h,S.target.m)}`;$("msg").className="msg";
      say(`這就是${speak(S.target.h,S.target.m)}`);setTimeout(next,3000)},900)}
  });
  function animateTo(h,m){
    const from=(S.h%12)*60+S.m,to=(h%12)*60+m;let d=to-from;if(d<0)d+=720;
    const t0=performance.now(),dur=1200;
    const step=now=>{const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,t=Math.round(from+d*e)%720;
      S.h=Math.floor(t/60)||12;S.m=t%60;draw();if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  }
  function finish(){
    S.phase="end";sfx.win();
    const r=S.score/S.total,st=r>=.9?3:r>=.6?2:1;
    $("stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
    $("endTitle").textContent=st===3?"太厲害了！":st===2?"做得很好！":"再練習一下！";
    $("endText").textContent=`${S.total} 題裡面，有 ${S.score} 題第一次就答對。`;
    $("end").hidden=false;say(`${$("endTitle").textContent}${S.total}題裡面，有${S.score}題第一次就答對`);
  }

  // ---- 撥時鐘：拖動指針，或按 ＋／− ----
  const total=()=>(S.h%12)*60+S.m;
  function setTotal(t){t=((t%720)+720)%720;S.h=Math.floor(t/60)||12;S.m=t%60;draw()}
  const st=()=>STEP[S.lv];
  $("mPlus").addEventListener("click",()=>{if(S.phase==="play"){setTotal(total()+st());sfx.click()}});
  $("mMinus").addEventListener("click",()=>{if(S.phase==="play"){setTotal(total()-st());sfx.click()}});
  $("hPlus").addEventListener("click",()=>{if(S.phase==="play"){setTotal(total()+60);sfx.click()}});
  $("hMinus").addEventListener("click",()=>{if(S.phase==="play"){setTotal(total()-60);sfx.click()}});
  const svg=$("clock");
  function angleOf(e){
    const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
    let a=Math.atan2(q.x-CX,-(q.y-CY))*180/Math.PI;return(a+360)%360;
  }
  let drag=null;
  [["minHand","m"],["hourHand","h"]].forEach(([id,which])=>{
    const el=$(id);
    el.addEventListener("pointerdown",e=>{
      if(S.phase!=="play"||S.kind!=="set")return;
      e.preventDefault();drag=which;el.classList.add("drag");try{el.setPointerCapture(e.pointerId)}catch(err){}
    });
    el.addEventListener("pointermove",e=>{
      if(drag!==which)return;
      const a=angleOf(e);
      if(which==="m"){
        const s=st(),nm=(Math.round(a/6/s)*s)%60;
        if(nm===S.m)return;
        let h=S.h%12,d=nm-S.m;if(d<-30)h++;else if(d>30)h--;   // 分針繞過 12，時針跟著走
        setTotal(((h+12)%12)*60+nm);sfx.click();
      }else{
        const nh=((Math.round((a-S.m*.5)/30))%12+12)%12;
        if(nh===S.h%12)return;setTotal(nh*60+S.m);sfx.click();
      }
    });
    const end=()=>{if(drag===which){drag=null;el.classList.remove("drag")}};
    el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  });

  $("go").addEventListener("click",start);
  $("replay").addEventListener("click",start);
  $("again").addEventListener("click",()=>{if(S.phase==="play")say(S.kind==="read"?"現在是幾點？":`請把時鐘撥到${speak(S.target.h,S.target.m)}`)});
  S.h=10;S.m=10;draw();upd();
})();
</script>
</body>
