<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>形狀搶答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 雙人對戰：兩人坐兩側（上半部旋轉 180°），各自依自己的難度找出指定形狀的東西（蛋糕、罐頭、骰子……），
   答對拿一顆星，先拿到 10 顆星的人贏。平面：三角形、圓形、正方形、長方形；立體：球體、圓柱體、正方體、長方體、圓錐體 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1f2b33; --muted:#66757d; --good:#1f9d61; --bad:#d23c3c;
  --p1:#2f6fdb; --p1-soft:#dbe7fb; --p2:#e0772b; --p2-soft:#fbe6d6;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{background:#eef3f1;color:var(--ink);font-family:var(--text);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
.board{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,.3fr) minmax(0,1fr)}
.side{position:relative;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.2vmin,12px);min-height:0;
  padding:clamp(8px,1.6vmin,14px) max(16px,env(safe-area-inset-right,0px)) clamp(8px,1.6vmin,14px) max(16px,env(safe-area-inset-left,0px))}
.side.p1{--c:var(--p1);--soft:var(--p1-soft);background:linear-gradient(to top,var(--p1-soft),#eef3f1)}
.side.p2{--c:var(--p2);--soft:var(--p2-soft);background:linear-gradient(to top,var(--p2-soft),#eef3f1);transform:rotate(180deg)}
.head{display:flex;align-items:center;gap:10px}
.name{font-weight:800;font-size:clamp(19px,3.2vmin,30px);color:var(--c);display:flex;align-items:center;gap:8px;white-space:nowrap}
.name::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.lvtag{font-size:clamp(14px,2.3vmin,20px);font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px}
.msg{flex:1;text-align:center;font-weight:800;font-size:clamp(17px,3vmin,26px);color:var(--muted)}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.spk{width:52px;height:52px;border-radius:14px;border:2px solid var(--c);background:#fff;font-size:26px;cursor:pointer;flex:none}
.spk.off{opacity:.45}
.home{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
/* 題目：找出 [圖示] 三角形 */
.ask{display:flex;align-items:center;justify-content:center;gap:.35em;font-weight:900;font-size:clamp(22px,4.2vmin,40px)}
.ask .ico{width:1.5em;height:1.5em;display:inline-block}
.ask .ico svg{width:100%;height:100%}
.ask .nm{color:var(--c)}
.choices{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:clamp(8px,1.6vmin,16px);min-height:0}
.ch{position:relative;border:0;border-radius:20px;background:#fff;padding:6%;cursor:pointer;touch-action:manipulation;aspect-ratio:1;max-height:min(24vmin,190px);
  justify-self:center;width:100%;max-width:min(24vmin,190px);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#c9d2d6);display:grid;place-items:center}
.ch svg{width:100%;height:100%}
.ch:active{transform:translateY(3px)}
.ch.wrong{background:#ffe1e1;animation:shake .35s}
.ch.right{background:#dcf7e6;box-shadow:0 0 0 5px var(--good)}
.side.locked .choices{opacity:.45;pointer-events:none}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
/* 準備卡片 */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vmin,14px);
  background:linear-gradient(to top,var(--soft),#eef3f1);padding:12px;text-align:center;z-index:3;overflow-y:auto}
.overlay h2{margin:0;font-size:clamp(24px,5vmin,48px);color:var(--c)}
.overlay .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.overlay .big{font-family:var(--num);font-weight:800;font-size:clamp(40px,9vmin,80px);line-height:1;color:var(--c)}
.homeb{display:grid;place-items:center;min-width:64px;font-size:30px;line-height:1;padding:8px 14px;border:2px solid #cfd8dc;background:#fff;
  border-radius:14px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.endrow{align-items:center;gap:12px!important}
@media (orientation:landscape){
  .overlay{flex-direction:row;flex-wrap:wrap;align-content:center;column-gap:clamp(10px,2vmin,20px);row-gap:clamp(6px,1.2vmin,10px)}
  .overlay h2{width:100%;font-size:clamp(22px,4vmin,38px)}
}
@media (orientation:landscape) and (max-height:600px){.overlay .opt small{display:none}.overlay h2{font-size:20px}}
.opt{font:inherit;font-size:clamp(15px,2.4vmin,19px);font-weight:700;border:2px solid #cfd8dc;background:#fff;border-radius:14px;padding:8px 14px;cursor:pointer;color:inherit}
.opt small{display:block;font-size:.72em;font-weight:600;opacity:.75}
.opt[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.ready{font-family:var(--text);font-weight:800;font-size:clamp(20px,4vmin,34px);border:0;border-radius:999px;padding:.45em 1.4em;
  background:var(--c);color:#fff;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.ready.on{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
/* 中間：兩排星星，誰先集滿 10 顆 */
.mid{display:grid;grid-template-rows:1fr 1fr;background:linear-gradient(#ffe9f3,#fff6d6);box-shadow:inset 0 3px 0 #fff,inset 0 -3px 0 #fff;
  padding:4px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.lane{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1vmin,10px)}
.lane.p2{transform:rotate(180deg)}
.lane i{font-style:normal;font-size:clamp(18px,3.4vmin,32px);line-height:1;filter:grayscale(1);opacity:.25;transition:all .3s}
.lane i.on{filter:none;opacity:1;animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
.count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;font-family:var(--num);font-weight:800;
  font-size:clamp(80px,20vmin,180px);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.3)}

/* 手機橫放：題目在左、選項在右，排成一行 */
@media (max-height:500px) and (orientation:landscape){
  .side{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:center;column-gap:14px;row-gap:4px}
  .head{grid-column:1/3} .ask{font-size:20px;flex-direction:column;gap:2px}
  .choices{height:100%;align-items:center} .ch{max-height:100%;max-width:90px;padding:5%}
}
</style>
<script src="zhuyin.js?v=20261123c"></script>
<script src="rest.js?v=20261123c"></script>

<style>:root{--theme:#1fb5a8}</style>
</head>
<body>
<div class="board">
  <section class="side p2" data-p="1" aria-label="橘色玩家"></section>
  <div class="mid" aria-label="星星">
    <div class="lane p2" id="lane1"></div>
    <div class="lane p1" id="lane0"></div>
  </div>
  <section class="side p1" data-p="0" aria-label="藍色玩家"></section>
</div>
<div class="count" id="count" hidden></div>

    ]
  };
  const SHAPE={tri:"三角形",circ:"圓形",sq:"正方形",rect:"長方形",ball:"球體",cyl:"圓柱體",cube:"正方體",cuboid:"長方體",cone:"圓錐體"};
  // 題目旁的小圖示（線條）
  const ICON={
    tri:S(`<path d="M50 14 L88 82 L12 82Z" fill="#fff" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>`),
    circ:S(`<circle cx="50" cy="50" r="38" fill="#fff" stroke="currentColor" stroke-width="7"/>`),
    sq:S(`<rect x="14" y="14" width="72" height="72" fill="#fff" stroke="currentColor" stroke-width="7"/>`),
    rect:S(`<rect x="6" y="26" width="88" height="48" fill="#fff" stroke="currentColor" stroke-width="7"/>`),
    ball:S(`<circle cx="50" cy="50" r="38" fill="#fff" stroke="currentColor" stroke-width="6"/><ellipse cx="50" cy="50" rx="38" ry="12" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="6 5"/>`),
    cyl:S(`<path d="M22 22 V78 A28 9 0 0 0 78 78 V22" fill="#fff" stroke="currentColor" stroke-width="6"/><ellipse cx="50" cy="22" rx="28" ry="9" fill="#fff" stroke="currentColor" stroke-width="6"/>`),
    cube:S(`<path d="M50 10 L86 27 L86 71 L50 90 L14 71 L14 27Z M14 27 L50 44 L86 27 M50 44 V90" fill="#fff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>`),
    cuboid:S(`<path d="M6 40 L24 26 L94 26 L94 62 L76 76 L6 76Z M6 40 L76 40 L94 26 M76 40 V76" fill="#fff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>`),
    cone:S(`<path d="M50 8 L80 80 A30 9 0 0 1 20 80Z" fill="#fff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>`)
  };
  // 難度：初級平面、進階立體、高級兩種混在一起（例如找圓柱體，旁邊會有圓圓的餅乾）
  const FLAT=["tri","circ","sq","rect"],SOLID=["ball","cyl","cube","cuboid","cone"];
  const LV={1:{name:"初級",sub:"平面：三角形、圓形…",pool:FLAT,n:3},2:{name:"進階",sub:"立體：球、圓柱…",pool:SOLID,n:4},3:{name:"高級",sub:"平面和立體混合",pool:[...FLAT,...SOLID],n:4}};
  // 容易搞混的放在一起出：初級不把正方形和長方形放在一起，高級特別把平面和像它的立體放在一起
  const TWIN={circ:["ball","cyl"],ball:["circ"],cyl:["circ","rect"],tri:["cone"],cone:["tri"],sq:["cube"],cube:["sq","cuboid"],rect:["cuboid"],cuboid:["rect","cube"]};

  const base=LV[+pref("park-level")]?+pref("park-level"):1;
  const P=[0,1].map(p=>({lv:+pref("shape-lv"+p)||base,voice:true,ready:false,pos:0,q:null,locked:false}));
  P.forEach(x=>{if(!LV[x.lv])x.lv=1});
  let phase="ready";
  const lanes=[$("lane0"),$("lane1")];lanes.forEach(l=>l.innerHTML="<i>⭐</i>".repeat(GOAL));

  // ---- 語音：排隊念 ----
  const synth=window.speechSynthesis;let voice=null;const rate=+(pref("duel-rate")||.9)||.9;
  const quality=v=>{const u=v.voiceURI||"";return /eloquence|speech\.synthesis\.voice/i.test(u)?0:/\.premium\./i.test(u)?3:/enhanced|-premium/i.test(u)?2:1};
  function pickVoice(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));const want=pref("duel-voice");
    const tw=vs.filter(v=>/TW|Hant/i.test(v.lang)&&quality(v)>0).sort((a,b)=>quality(b)-quality(a));
    voice=(want&&vs.find(v=>(v.voiceURI||v.name)===want))||tw[0]||vs.find(v=>quality(v)>0)||vs[0]||null}
  if(synth){pickVoice();try{synth.addEventListener("voiceschanged",pickVoice)}catch(e){}}
  const queue=[];let speaking=false,guard=null;
  function speakNext(){
    if(speaking||!queue.length||!synth)return;
    const item=queue.shift();speaking=true;
    const done=()=>{if(!speaking)return;speaking=false;clearTimeout(guard);setTimeout(speakNext,150)};
    try{const u=new SpeechSynthesisUtterance(item.t);u.lang=voice?voice.lang.replace("_","-"):"zh-TW";if(voice)u.voice=voice;u.rate=rate;u.pitch=1.1;
      u.onend=done;u.onerror=done;synth.speak(u)}catch(e){done()}
    guard=setTimeout(done,7000);
  }
  function enqueue(p,t){for(let i=queue.length-1;i>=0;i--)if(queue[i].p===p)queue.splice(i,1);queue.push({p,t});speakNext()}
  function sayNow(t){queue.length=0;try{synth&&synth.cancel()}catch(e){}speaking=false;queue.push({p:-1,t});speakNext()}
  let ac=null;
  function tone(fs,dur=.12,type="triangle",vol=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();
    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.7)})}catch(e){}}
  const sfx={good:()=>tone([784,1175],.12,"sine",.28),bad:()=>tone([150],.3,"square",.15),tick:()=>tone([600],.1),go:()=>tone([900],.25),win:()=>tone([523,659,784,1047],.16)};
  {const _g=sfx.good;sfx.good=(...a)=>{try{window.parkBurst&&parkBurst()}catch(err){}return _g(...a)}}
  function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}
    try{if(synth&&!synth.speaking){const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}}catch(e){}}

  // ---- 出題 ----
  function makeQ(lv,last){
    const L=LV[lv];let t,k=0;
    do{t=L.pool[rnd(0,L.pool.length-1)]}while(last&&t===last.t&&++k<10);
    let others=L.pool.filter(s=>s!==t);
    if(lv===1&&(t==="sq"||t==="rect"))others=others.filter(s=>s!=="sq"&&s!=="rect");
    // 高級：先放一個「看起來很像」的干擾
    const picks=[];
    if(lv===3){const tw=(TWIN[t]||[]).filter(s=>others.includes(s));if(tw.length)picks.push(tw[rnd(0,tw.length-1)])}
    shuffle(others.filter(s=>!picks.includes(s))).forEach(s=>{if(picks.length<L.n-1)picks.push(s)});
    const pick=s=>ITEMS[s][rnd(0,ITEMS[s].length-1)];
    const opts=shuffle([{s:t,item:pick(t),ok:true},...picks.map(s=>({s,item:pick(s),ok:false}))]);
    return{t,opts};
  }
  const qText=q=>`找出${SHAPE[q.t]}的東西`;

  // ---- 畫面 ----
  const ui=[...document.querySelectorAll(".side")].sort((a,b)=>a.dataset.p-b.dataset.p).map((el,p)=>{
    el.innerHTML=`
      <div class="head"><a class="home" href="park.html" aria-label="回遊樂園地圖">🏠</a><span class="name">${NAMES[p]}</span><span class="lvtag"></span><span class="msg" data-zy></span>
        <button type="button" class="spk" aria-label="念我的題目">🔊</button></div>
      <div class="ask" data-zy></div>
      <div class="choices"></div>
      <div class="overlay">
        <h2>${NAMES[p]}找形狀</h2>
        <div class="row lvs">${[1,2,3].map(l=>`<button type="button" class="opt" data-lv="${l}" aria-label="${LV[l].name}"><span class="lvst">${STAR[l]}</span><small>${LV[l].sub}</small></button>`).join("")}</div>
        <div class="row"><button type="button" class="opt vbtn"></button></div>
        <div class="big" hidden></div>
        <div class="row endrow"><button type="button" class="ready">READY</button><a class="homeb" href="park.html" aria-label="回遊樂園">🏠</a></div>
      </div>`;
    const u={el,msg:el.querySelector(".msg"),ask:el.querySelector(".ask"),choices:el.querySelector(".choices"),lvtag:el.querySelector(".lvtag"),spk:el.querySelector(".spk"),
      ov:el.querySelector(".overlay"),h2:el.querySelector(".overlay h2"),big:el.querySelector(".overlay .big"),
      lvs:[...el.querySelectorAll(".lvs .opt")],vbtn:el.querySelector(".vbtn"),ready:el.querySelector(".ready")};
    u.lvs.forEach(b=>b.addEventListener("click",()=>{if(phase!=="ready")return;P[p].lv=+b.dataset.lv;pref("shape-lv"+p,P[p].lv);autoVoice();syncSetup()}));
    u.vbtn.addEventListener("click",()=>{if(phase!=="ready")return;P[p].voice=!P[p].voice;syncSetup()});
    u.ready.addEventListener("click",()=>toggleReady(p));
    u.spk.addEventListener("click",()=>{if(phase==="play"&&P[p].q)enqueue(p,`${NAMES[p]}，${qText(P[p].q)}`)});
    return u;
  });
  function autoVoice(){
    if(P[0].lv===P[1].lv){P[0].voice=P[1].voice=true}
    else{const low=P[0].lv<P[1].lv?0:1;P[low].voice=true;P[1-low].voice=false}
  }
  function syncSetup(){
    ui.forEach((u,p)=>{
      u.lvs.forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===P[p].lv));
      u.vbtn.textContent=P[p].voice?"🔊":"🔇";u.vbtn.setAttribute("aria-label",P[p].voice?"念題目：開":"念題目：關");u.vbtn.setAttribute("aria-pressed",P[p].voice);
      u.lvtag.textContent=STAR[P[p].lv];u.lvtag.setAttribute("aria-label",LV[P[p].lv].name);u.spk.classList.toggle("off",!P[p].voice);
    });
  }
  function drawStars(){lanes.forEach((l,p)=>[...l.children].forEach((s,i)=>s.classList.toggle("on",i<P[p].pos)))}

  // ---- 流程 ----
  function showReady(){
    phase="ready";queue.length=0;try{synth&&synth.cancel()}catch(e){}
    P.forEach(x=>{x.ready=false;x.pos=0;x.q=null;x.locked=false});drawStars();
    ui.forEach((u,p)=>{u.ov.hidden=false;u.h2.textContent=`${NAMES[p]}找形狀`;u.big.hidden=true;u.ready.textContent="READY";u.ready.classList.remove("on");
      u.lvs[0].parentElement.hidden=false;u.vbtn.parentElement.hidden=false;u.ask.innerHTML="";u.choices.innerHTML="";u.msg.textContent="";u.el.classList.remove("locked")});
    syncSetup();
  }
  function toggleReady(p){
    unlock();
    if(phase==="over"){showReady();return}
    if(phase!=="ready")return;
    P[p].ready=!P[p].ready;const b=ui[p].ready;b.classList.toggle("on",P[p].ready);b.textContent=P[p].ready?"✅":"READY";sfx.tick();
    if(P[0].ready&&P[1].ready)countdown();
  }
  function countdown(){
    phase="count";ui.forEach(u=>u.ov.hidden=true);
    const c=$("count");let n=3;c.hidden=false;c.textContent=n;sfx.tick();
    const iv=setInterval(()=>{n--;if(n>0){c.textContent=n;sfx.tick();return}
      clearInterval(iv);c.hidden=true;sfx.go();phase="play";
      try{navigator.wakeLock?.request("screen").catch(()=>{})}catch(e){}
      [0,1].forEach(p=>newQ(p));
    },800);
  }
  function newQ(p){
    const x=P[p],u=ui[p];x.q=makeQ(x.lv,x.q);x.locked=false;u.el.classList.remove("locked");u.msg.textContent="";u.msg.className="msg";
    u.ask.innerHTML=`<span>找出</span><span class="ico" style="color:var(--c)">${ICON[x.q.t]}</span><span class="nm">${SHAPE[x.q.t]}</span>`;
    u.choices.style.setProperty("--n",x.q.opts.length);
    u.choices.innerHTML=x.q.opts.map((o,i)=>`<button type="button" class="ch" data-i="${i}" aria-label="${o.item.n}">${o.item.s}</button>`).join("");
    u.choices.querySelectorAll(".ch").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();answer(p,b)}));
    if(x.voice)enqueue(p,`${NAMES[p]}，${qText(x.q)}`);
  }
  function answer(p,b){
    const x=P[p],u=ui[p];
    if(phase!=="play"||x.locked)return;
    const o=x.q.opts[+b.dataset.i];
    if(o.ok){
      b.classList.add("right");sfx.good();x.pos++;drawStars();x.locked=true;
      u.msg.textContent=`答對了！${o.item.n}是${SHAPE[o.s]}`;u.msg.className="msg good";
      if(x.pos>=GOAL)return setTimeout(()=>finish(p),600);
      setTimeout(()=>{if(phase==="play")newQ(p)},900);
    }else{
      b.classList.add("wrong");sfx.bad();x.locked=true;u.el.classList.add("locked");
      u.msg.textContent=`${o.item.n}是${SHAPE[o.s]}喔`;u.msg.className="msg bad";
      setTimeout(()=>{if(phase==="play"&&x.locked){x.locked=false;u.el.classList.remove("locked");b.classList.remove("wrong");u.msg.textContent="";u.msg.className="msg"}},1500);
    }
  }
  function finish(w){
    phase="over";sfx.win();
    ui.forEach((u,p)=>{u.ov.hidden=false;u.h2.textContent=p===w?"你贏了！🏆":"再接再厲！";u.big.hidden=false;u.big.textContent=`⭐ ${P[p].pos} / ${GOAL}`;
      u.lvs[0].parentElement.hidden=true;u.vbtn.parentElement.hidden=true;u.ready.textContent="🔁";u.ready.classList.remove("on")});
    try{window.parkWin&&parkWin(ui[w].ov)}catch(e){}
    sayNow(`${NAMES[w]}先集滿${GOAL}顆星星，${NAMES[w]}贏了！`);
  }
  autoVoice();showReady();
})();
</script>
</body>
