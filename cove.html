<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>海盜灣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="en.css?v=20261125c">
<style>
/* 海盜灣地圖：海上一座沙灘小島，一條小路彎彎曲曲連起七個地點（先開放三個） */
body{background:linear-gradient(#8fdcf2,#4fbfe0 40%,#2b9cc4);align-items:center;justify-content:center;gap:clamp(6px,1.2vmin,12px);
  padding:max(10px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.waves{position:fixed;inset:0;pointer-events:none;opacity:.35;
  background:radial-gradient(ellipse 26px 6px at 50% 50%,transparent 60%,#fff 62% 75%,transparent 77%) 0 0/90px 46px;animation:wv 9s linear infinite}
@keyframes wv{to{background-position:90px 0}}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:1100px}
header .home{position:absolute;left:0;top:50%;transform:translateY(-50%)}
header .home:active{transform:translateY(calc(-50% + 3px))}
header .home2{position:absolute;left:62px;top:50%;transform:translateY(-50%)}
header .home2:active{transform:translateY(calc(-50% + 3px))}
/* 手機直放：跟數學遊樂園一樣，左右兩邊是捷徑按鈕，標題在中間同一排 */
@media (max-width:600px){header{display:grid!important;grid-template-columns:46px minmax(0,1fr) 46px;column-gap:8px;row-gap:6px;align-items:center}
  header .home,header .home2,header .right{position:static!important;transform:none!important;grid-row:1;width:46px;height:46px;font-size:24px}
  header .home{grid-column:1}header .home2{grid-column:3}header .home2 svg{width:36px;height:36px}header .right{display:none}
  header .ttl{display:contents}header .ttl h1{grid-column:2;grid-row:1;justify-self:center;font-size:21px!important;padding:.16em .6em .2em!important;border-width:3px;letter-spacing:.04em}
  header .ttl h1 .star,header .ttl h1 .flag{display:none}
  header .ttl>:not(h1){grid-column:1/-1;grid-row:2;justify-self:center}}
header .right{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:center}
.ttl{display:flex;flex-direction:column;align-items:center;gap:2px}
h1{margin:0;font-size:clamp(26px,5vmin,52px);line-height:1.15;font-weight:800;letter-spacing:.08em;color:#fff;
  padding:.18em .9em .22em;border-radius:22px 22px 14px 14px;border:4px solid #fff;
  background:repeating-linear-gradient(90deg,#1666a8 0 28px,#2a86c9 28px 56px);
  text-shadow:0 3px 0 #0b3f6b;box-shadow:0 6px 0 #0f4c80,0 12px 22px rgba(0,0,0,.18);display:flex;align-items:center;gap:.3em}
h1 .flag{font-size:.7em;text-shadow:none}
.ttl .sub{margin:0;font-family:var(--en);font-weight:700;font-size:clamp(15px,2.4vmin,20px);color:#2b2320;background:#ffe27a;border:3px solid #fff;border-radius:999px;padding:0 14px;box-shadow:0 3px 0 #e2b23b}
.shopbtn{width:56px;height:56px;padding:0;border-radius:16px;border:0;background:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);display:block}
.shopbtn .parrot{width:100%;height:100%;display:block}
/* 地圖 */
.map{position:relative;z-index:1;width:min(100%,calc((100dvh - 120px) * 1.6));aspect-ratio:16/10;border-radius:30px;overflow:hidden;
  background:#4fc3e6;border:6px solid #fff;box-shadow:0 0 0 4px #1f7fa8,0 14px 30px rgba(0,0,0,.2)}
.map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;transform:translate(-50%,-38%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;
  border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
.spot .icon{position:relative;width:clamp(48px,9.6cqw,140px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff 0 55%,color-mix(in srgb,var(--c) 14%,#fff));border:clamp(3px,.5cqw,6px) solid var(--c);
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#000),0 10px 16px rgba(0,0,0,.2)}
.spot .icon svg{width:72%;height:72%;display:block;overflow:visible}
.spot:active .icon{transform:translateY(4px)}
.spot .name{background:var(--c);color:#fff;border:2px solid #fff;border-radius:12px;padding:0 clamp(6px,1cqw,13px);font-weight:800;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.14);font-size:clamp(13px,2.2cqw,28px)}
.spot .tag{white-space:nowrap;font-family:var(--en);font-weight:700;color:color-mix(in srgb,var(--c) 75%,#000);background:rgba(255,255,255,.92);border-radius:999px;
  padding:0 9px;box-shadow:0 2px 0 rgba(0,0,0,.08);font-size:clamp(11px,1.5cqw,19px)}
.spot.open .icon{animation:bob 2.6s ease-in-out infinite}
.spot.open:nth-of-type(2n) .icon{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.spot.lock .icon{filter:grayscale(.75);opacity:.8}
.spot.lock .icon::after{content:"🔒";position:absolute;right:-8%;bottom:-6%;font-size:clamp(16px,3cqw,34px)}
.spot.lock .name{background:#8a96a0}
.deco{position:absolute;transform:translate(-50%,-60%);pointer-events:none;z-index:2}
.deco svg{display:block;width:100%;height:100%}
.map{container-type:inline-size}
@media (orientation:portrait){.map{aspect-ratio:4/5;width:min(100%,calc((100dvh - 130px) * .8))}
  .spot .icon{width:clamp(48px,12.5cqw,150px)} .spot .name{font-size:clamp(13px,3cqw,30px)} .spot .tag{font-size:clamp(11px,2.1cqw,20px)}}
/* 手機直放：地圖變長，往下捲 */
html.phone,html.phone body{height:auto;min-height:100%}
html.phone body{overflow-y:auto;justify-content:flex-start}
html.phone .map{width:100%;aspect-ratio:auto;height:calc((100vw - 28px) * 2.05);max-height:none}
html.phone .spot .icon{width:84px}
html.phone .spot .name{font-size:16px}
@media (max-width:370px){html.phone .spot .name{font-size:14px}html.phone .spot .icon{width:76px}} html.phone .spot .tag{font-size:13px}
@media (max-height:500px){h1{font-size:22px;border-width:3px}h1 .flag{display:none}.ttl .sub{display:none}.map{width:min(100%,calc((100dvh - 64px) * 1.6))}.shopbtn{width:48px;height:48px}}
@media (max-width:600px){header{flex-direction:column}header .home,header .right{top:4px;transform:none}h1{font-size:24px}}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:999px;font-size:18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s;white-space:nowrap}
.toast[hidden]{display:block!important;opacity:0;pointer-events:none}
/* 帽子商店 */
#shop .box{width:min(640px,100%)}
.hats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.hatc{position:relative;border:4px solid #e3d3b8;background:#fff;border-radius:18px;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit}
.hatc .parrot{width:70%;max-width:96px;aspect-ratio:100/122;height:auto;display:block}
.hatc .price{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:800;font-size:20px}
.hatc .price .coin{width:22px;height:22px}
.hatc.worn{border-color:#1f9d61;background:#eafff2}
.hatc.worn::after{content:"✅";position:absolute;right:6px;top:4px;font-size:22px}
.hatc.poor{opacity:.55}
.hatc.shake{animation:wig .4s}
@keyframes wig{25%{translate:-6px 0}75%{translate:6px 0}}
@media (max-width:420px){.hats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script src="zhuyin.js?v=20261125c"></script>
<script src="rest.js?v=20261125c"></script>
<script src="warm.js?v=20261125c" defer></script>
<link rel="stylesheet" href="park.css?v=20261125c">
<script src="park.js?v=20261125c"></script>
<script src="en.js?v=20261125c"></script>
<style>body{font-family:var(--text)}</style>
</head>
<body>
<div class="waves" aria-hidden="true"></div>
<header>
  <a class="ibtn home mapbtn" href="./" aria-label="回選地圖">🗺️</a>
  <div class="ttl"><h1><span class="flag">⭐</span>海盜灣<span class="flag">⭐</span></h1></div>
</header>
<div class="map" id="map" role="navigation" aria-label="海盜灣地圖">
  <svg id="art" aria-hidden="true"></svg>
  <div id="decos" aria-hidden="true"></div>
</div>
<div class="toast" id="toast" role="status" data-zy hidden></div>


<script>
(()=>{
  const $=id=>document.getElementById(id),K="#3a2a22";
  const g=b=>`<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="${K}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">${b}</g></svg>`;
  const IC={
    dock:g(`<path d="M14 88L64 12" fill="none" stroke="#a8683a" stroke-width="7"/><path d="M64 12q18 6 18 36" fill="none" stroke-width="2.5"/>
      <path d="M58 64 44 52v24z" fill="#ff6a1a"/><ellipse cx="74" cy="64" rx="18" ry="12" fill="#ff8a3d"/><circle cx="82" cy="61" r="2.6" fill="${K}" stroke="none"/>`),
    chest:g(`<path d="M16 46v-8q34-26 68 0v8z" fill="#a0562b"/><rect x="16" y="46" width="68" height="38" rx="5" fill="#c46f36"/>
      <path d="M16 46h68" stroke="#ffd23f" stroke-width="5"/><rect x="43" y="52" width="14" height="14" rx="3" fill="#ffd23f"/>
      <path d="M50 30q10-14 18-6q-8 2-10 10" fill="#ef4b3c"/><circle cx="60" cy="24" r="2" fill="${K}" stroke="none"/>`),
    abc:g(`<path d="M30 12h40l22 26-42 52L8 38z" fill="#2f7bff"/><path d="M8 38h84" fill="none" stroke-width="2.5" opacity=".5"/>
      <text x="50" y="64" text-anchor="middle" font-family="Andika,sans-serif" font-weight="700" font-size="34" fill="#fff" stroke="none">Aa</text>`),
    story:g(`<path d="M50 28q-18-12-40-8v58q22-4 40 8q18-12 40-8V20q-22-4-40 8z" fill="#fff"/><path d="M50 28v58" fill="none"/>
      <path d="M18 36q12-2 24 4M18 50q12-2 24 4M58 40q12-6 24-4M58 54q12-6 24-4" fill="none" stroke-width="3" opacity=".5"/>`),
    spell:g(`<rect x="8" y="40" width="26" height="26" rx="5" fill="#ffd23f"/><rect x="37" y="30" width="26" height="26" rx="5" fill="#ff8fc7"/><rect x="66" y="40" width="26" height="26" rx="5" fill="#7cc7ff"/>
      <g font-family="Andika,sans-serif" font-weight="700" font-size="20" fill="${K}" stroke="none" text-anchor="middle"><text x="21" y="60">c</text><text x="50" y="50">a</text><text x="79" y="60">t</text></g>`),
    chat:g(`<path d="M10 18h52q8 0 8 8v22q0 8-8 8H32l-12 12v-12h-2q-8 0-8-8V26q0-8 8-8z" fill="#fff"/><path d="M48 50h34q8 0 8 8v14q0 8-8 8h-2v10l-10-10H48q-8 0-8-8V58q0-8 8-8z" fill="#ffd23f"/>`),
    home:g(`<path d="M12 48 50 16l38 32" fill="#ef4b3c"/><path d="M22 44v42h56V44" fill="#ffe0b0"/><rect x="42" y="60" width="16" height="26" rx="2" fill="#a8683a"/><rect x="28" y="52" width="10" height="10" fill="#bfe6ff" stroke-width="3"/><rect x="62" y="52" width="10" height="10" fill="#bfe6ff" stroke-width="3"/>`)
  };
  const SPOTS=[
    {k:"dock",name:"碼頭釣魚",tag:"Fishing",c:"#f07a2a",href:"dock.html"},
    {k:"chest",name:"寶箱與鸚鵡",tag:"On · In · Under",c:"#c2551f",href:"chest.html"},
    {k:"abc",name:"藏寶圖字母",tag:"ABC",c:"#2f6fdb",href:"abc.html"},
    {k:"story",name:"船長說故事",tag:"Story",c:"#7a4fd6",href:"story.html"},
    {k:"spell",name:"鸚鵡拼字",tag:"Spelling",c:"#d1478f",href:"spell.html"},
    {k:"chat",name:"港口聊天",tag:"Talk",c:"#14a99c",href:"chat.html"},
    {k:"home",name:"船長的家",tag:"Rooms",c:"#2b7f50",href:"home.html"}
  ];
  const map=$("map");
  SPOTS.forEach(s=>{
    const a=document.createElement(s.href?"a":"button");a.className="spot "+(s.href?"open":"lock");a.style.setProperty("--c",s.c);a.dataset.k=s.k;
    if(s.href)a.href=s.href;else a.type="button";
    a.innerHTML=`<span class="icon">${IC[s.k]}</span><span class="name" data-zy>${s.name}</span><span class="tag">${s.tag}</span>`;
    if(!s.href)a.addEventListener("click",()=>toast("即將開放，敬請期待！"));
    map.appendChild(a);
  });
  // 小路：七個點排成之字形；手機直放是兩欄往下
  const LAY={
    land:{H:62.5,pts:[[12,72],[24,34],[38,72],[52,34],[66,72],[78,34],[89,72]],decos:[["palm",6,16,8],["palm",95,18,7]]},
    port:{H:125,pts:[[27,11],[73,24],[27,37],[73,50],[27,63],[73,76],[27,89]],decos:[["palm",76,7,11],["x",76,93,7],["palm",8,52,9],["rock",92,38,6]]},
    phone:{H:205,pts:[[26,8],[74,21],[26,34],[74,47],[26,60],[74,73],[26,86]],decos:[["palm",80,5,13]]}
  };
  const DECO={
    palm:`<svg viewBox="0 0 100 120"><g stroke="${K}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M50 116q-8-40 4-80" fill="none" stroke="#a8683a" stroke-width="9"/>
      <path d="M54 36q-26-20-46-6q20-2 46 6zM54 36q26-20 46-6q-20-2-46 6zM54 36q-10-28-34-30q16 10 34 30zM54 36q10-28 34-30q-16 10-34 30z" fill="#3bbf6a"/>
      <circle cx="50" cy="40" r="5" fill="#8a5328"/><circle cx="60" cy="40" r="5" fill="#8a5328"/></g></svg>`,
    x:`<svg viewBox="0 0 100 100"><path d="M24 24l52 52M76 24 24 76" stroke="#d23c3c" stroke-width="13" stroke-linecap="round"/></svg>`,
    rock:`<svg viewBox="0 0 100 70"><path d="M8 64q-4-30 22-40q14-18 34-8q28 4 30 48z" fill="#9aa8b8" stroke="${K}" stroke-width="4" stroke-linejoin="round"/></svg>`
  };
  function smooth(pts){
    let d=`M${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
      d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]} ${p2[1]}`}
    return d;
  }
  const phoneMQ=matchMedia("(max-width:600px)");
  function layout(){
    const phone=phoneMQ.matches;document.documentElement.classList.toggle("phone",phone);
    const L=phone?LAY.phone:matchMedia("(orientation:portrait)").matches?LAY.port:LAY.land,H=L.H;
    const P=L.pts.map(([x,y])=>[x,y*H/100]);
    $("art").setAttribute("viewBox",`0 0 100 ${H}`);
    $("art").innerHTML=`<rect x="3.5" y="3.5" width="93" height="${H-7}" rx="10" fill="#fff" opacity=".55"/>
      <rect x="5" y="5" width="90" height="${H-10}" rx="9" fill="#f7e2ae"/>
      <rect x="5" y="5" width="90" height="${H-10}" rx="9" fill="none" stroke="#e8c98a" stroke-width="1" stroke-dasharray="1.5 2.5"/>
      <path d="${smooth(P)}" fill="none" stroke="#d9b06a" stroke-width="7.5" stroke-linecap="round"/>
      <path d="${smooth(P)}" fill="none" stroke="#efcf8f" stroke-width="5.5" stroke-linecap="round"/>
      <path d="${smooth(P)}" fill="none" stroke="#fff" stroke-width=".7" stroke-dasharray="1.6 2.4" stroke-linecap="round" opacity=".9"/>`;
    SPOTS.forEach((s,i)=>{const a=map.querySelector(`[data-k="${s.k}"]`);a.style.left=L.pts[i][0]+"%";a.style.top=L.pts[i][1]+"%"});
    $("decos").innerHTML=L.decos.map(([k,x,y,w])=>w?`<span class="deco" style="left:${x}%;top:${y}%;width:${w}%;aspect-ratio:${k==="palm"?"100/120":k==="rock"?"100/70":"1"}">${DECO[k]}</span>`:"").join("");
  }
  layout();
  matchMedia("(orientation:portrait)").addEventListener?.("change",layout);phoneMQ.addEventListener?.("change",layout);
  let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(layout,150)});addEventListener("load",layout);

  // ---- 提示 ----
  let tt=0;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,1800)}
})();
</script>
</body>
</html>
