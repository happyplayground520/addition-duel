<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>數學遊樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 遊樂園導覽地圖：一條環狀主路繞一圈，中間是馬戲團大帳篷，入口在下方；點設施進入小遊戲 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1f2b33; --muted:#5d6b72;
  --sky1:#9fdcff; --sky2:#d8f1ff;
  --grass:#a6dc7f; --grass2:#93d06b; --grass3:#b8e692;
  --path:#fbeccb; --path-edge:#e7cf9c;
  --sign:#fffaf0;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--sky1),var(--sky2) 30%,var(--grass3) 30.1%,var(--grass) 100%);color:var(--ink);font-family:var(--text);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vmin,14px);position:relative;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* 天空：太陽和慢慢飄的雲 */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sun{position:absolute;left:5%;top:3%;width:clamp(48px,9vmin,90px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff6a8 0 45%,#ffd84d 46% 62%,rgba(255,216,77,0) 63%);box-shadow:0 0 40px 10px rgba(255,230,120,.55)}
.cloud{position:absolute;font-size:clamp(30px,6vmin,60px);opacity:.95;animation:drift 38s linear infinite}
.cloud.c2{top:9%;animation-duration:52s;animation-delay:-20s;font-size:clamp(22px,4.4vmin,44px)}
@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
header,.map,.toast{position:relative;z-index:1}
/* 右上角：注音開關（所有小遊戲一起套用） */
.zybtn{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:clamp(15px,2.2vmin,19px);color:var(--ink);
  background:#fff;border:3px solid #fff;border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;box-shadow:0 4px 0 #b9dff5,0 8px 16px rgba(0,0,0,.12)}
.zybtn .sw{position:relative;width:52px;height:30px;border-radius:999px;background:#cfd8dc;transition:background .2s}
.zybtn .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.zybtn[aria-pressed="true"] .sw{background:#1f9d61}
.zybtn[aria-pressed="true"] .sw::after{transform:translateX(22px)}
.zybtn .st{min-width:1.2em;color:var(--muted)}
@media (orientation:portrait){.zybtn{top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px))}}
/* 標題招牌：紅白條紋的帳篷布，下面一條緞帶 */
header{display:flex;flex-direction:column;align-items:center;gap:4px}
h1{margin:0;font-size:clamp(26px,5vmin,52px);line-height:1.15;font-weight:800;letter-spacing:.08em;color:#fff;
  padding:.18em .9em .22em;border-radius:22px 22px 14px 14px;border:4px solid #fff;
  background:repeating-linear-gradient(90deg,#e8434f 0 28px,#ff6b6b 28px 56px);
  text-shadow:0 3px 0 #a3202b;box-shadow:0 6px 0 #b82a35,0 12px 22px rgba(0,0,0,.18);display:flex;align-items:center;gap:.3em}
h1 .star{font-size:.7em;text-shadow:none}
.sub{margin:0;font-size:clamp(14px,2.3vmin,20px);font-weight:800;color:#7a4b12;background:#ffe27a;border:3px solid #fff;
  border-radius:999px;padding:2px 16px;box-shadow:0 3px 0 #e2b23b}
/* 地圖畫布：橫向 16:10，直拿平板時改成 4:5 */
.map{position:relative;width:min(100%,calc((100dvh - 120px) * 1.6));aspect-ratio:16/10;
  background:
    radial-gradient(circle at 12% 88%,var(--grass2) 0 7%,transparent 7.5%),
    radial-gradient(circle at 90% 10%,var(--grass2) 0 6%,transparent 6.5%),
    radial-gradient(circle,rgba(255,255,255,.18) 1.5px,transparent 2px) 0 0/26px 26px,
    var(--grass);
  border-radius:30px;border:6px solid #fff;box-shadow:0 0 0 4px #7cc35a,0 14px 30px rgba(0,0,0,.18);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.road-edge,.road,.road-dash{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road-edge{stroke:var(--path-edge);stroke-width:62px} .road{stroke:var(--path);stroke-width:52px}
.road-dash{stroke:#fff;stroke-width:3px;stroke-dasharray:10 14;opacity:.9}
.pond{fill:#8fd3f4;stroke:#fff;stroke-width:3px;vector-effect:non-scaling-stroke}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;line-height:1}
/* 頂端的彩色小旗子 */
.bunting{position:absolute;left:0;right:0;top:0;height:7%;display:flex;justify-content:space-around;pointer-events:none;z-index:1}
.bunting::before{content:"";position:absolute;left:-2%;right:-2%;top:18%;height:2px;background:#fff;opacity:.9}
.bunting i{width:3.2%;height:100%;clip-path:polygon(0 18%,100% 18%,50% 100%)}
/* 入口拱門 */
.gate{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:20%;height:9%;pointer-events:none;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-start}
.gate::before,.gate::after{content:"";width:9%;height:100%;border-radius:6px 6px 0 0;background:repeating-linear-gradient(#e8434f 0 8px,#fff 8px 16px)}
.gate b{position:absolute;left:-6%;right:-6%;top:-38%;display:flex;align-items:center;justify-content:center;gap:.2em;padding:.1em 0;border-radius:999px;
  background:#ffe27a;border:3px solid #fff;color:#7a4b12;font-weight:800;font-size:clamp(12px,1.9cqw,24px);box-shadow:0 3px 0 #e2b23b;white-space:nowrap}
/* 設施 */
.spot{position:absolute;transform:translate(-50%,-38%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3;
  border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
.spot .icon{position:relative;width:clamp(56px,13vmin,130px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(32px,7.6vmin,76px);background:radial-gradient(circle at 35% 30%,#fff 0 55%,color-mix(in srgb,var(--c) 12%,#fff));
  box-shadow:0 5px 0 color-mix(in srgb,var(--c) 75%,#000),0 10px 16px rgba(0,0,0,.18);
  border:5px solid var(--c);transition:transform .12s}
.spot:active .icon{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 75%,#000),0 4px 10px rgba(0,0,0,.18)}
.spot:focus-visible .icon{outline:4px solid #fff;outline-offset:3px}
.spot .name{background:var(--c);color:#fff;border:2px solid #fff;border-radius:12px;padding:1px 12px;
  font-weight:800;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.14);letter-spacing:.04em}
.spot .tag{white-space:nowrap;font-weight:800;color:color-mix(in srgb,var(--c) 80%,#000);background:rgba(255,255,255,.92);
  border-radius:999px;padding:0 9px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.spot.big .icon{border-width:6px}
.spot.open .icon{animation:bob 2.6s ease-in-out infinite}
.spot.open:nth-child(odd) .icon{animation-delay:-1.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:17px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s;white-space:nowrap}
.toast[hidden]{display:block;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.spot.open .icon,.cloud{animation:none}}
/* 設施大小跟著地圖寬度縮放 */
@supports (container-type:inline-size){
  .map{container-type:inline-size}
  .spot .icon{width:clamp(44px,10.5cqw,150px);font-size:clamp(24px,6.2cqw,90px);border-width:clamp(3px,.5cqw,6px)}
  .spot.big .icon{width:clamp(52px,13cqw,180px);font-size:clamp(30px,8cqw,110px)}
  .spot .name{font-size:clamp(13px,2.5cqw,32px);padding:0 clamp(6px,1.1cqw,14px)}
  .spot .tag{font-size:clamp(11px,1.65cqw,20px);padding:0 clamp(5px,.9cqw,11px)}
  .deco{font-size:clamp(14px,3.2cqw,40px)}
  .road-edge{stroke-width:max(18px,5.4cqw)} .road{stroke-width:max(14px,4.4cqw)}
}
/* 直拿平板：地圖改成直的 */
@media (orientation:portrait){
  .map{aspect-ratio:4/5;width:min(100%,calc((100dvh - 130px) * .8))}
  @supports (container-type:inline-size){
    .spot .icon{width:clamp(44px,13.5cqw,150px);font-size:clamp(24px,8cqw,90px)}
    .spot.big .icon{width:clamp(52px,17cqw,180px);font-size:clamp(30px,10.5cqw,110px)}
    .spot .name{font-size:clamp(13px,3.3cqw,32px)} .spot .tag{font-size:clamp(11px,2.2cqw,20px)}
    .road-edge{stroke-width:max(18px,6.6cqw)} .road{stroke-width:max(14px,5.4cqw)}
    .gate{width:26%;height:7%} .gate b{font-size:clamp(12px,2.6cqw,24px)}
  }
}
/* 手機橫放：標題縮小，讓地圖大一點 */
@media (max-height:500px){
  h1{font-size:22px;border-width:3px} .sub{display:none}
  .map{width:min(100%,calc((100dvh - 56px) * 1.6))}
}
</style>
<script src="zhuyin.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>:root{--text:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="sun"></div><span class="cloud" style="top:3%">☁️</span><span class="cloud c2">☁️</span></div>
<header>
  <h1><span class="star">⭐</span>數學遊樂園<span class="star">⭐</span></h1>
  <p class="sub" data-zy>點一個設施開始玩！</p>
</header>

<div class="map" role="navigation" aria-label="遊樂園地圖">
  <svg viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true">
    <ellipse class="pond" cx="8" cy="10" rx="14" ry="9"/>
    <path class="road-edge" id="roadEdge"/><path class="road" id="road"/><path class="road-dash" id="roadDash"/>
  </svg>
  <div class="bunting" aria-hidden="true"></div>
  <div class="gate" aria-hidden="true"><b data-zy>🎉 入口</b></div>
  <div id="decos" aria-hidden="true"></div>

  <a class="spot open" data-k="booth" href="booth.html" style="--c:#e0772b">
    <span class="icon">🎟️</span><span class="name" data-zy>售票亭</span><span class="tag">👤 認識錢幣</span>
  </a>
  <a class="spot open" data-k="train" href="train.html" style="--c:#c0392b">
    <span class="icon">🚂</span><span class="name" data-zy>小火車</span><span class="tag">👥 大富翁</span>
  </a>
  <a class="spot open" data-k="bumper" href="bumper.html" style="--c:#2f6fdb">
    <span class="icon">🚗</span><span class="name" data-zy>碰碰車</span><span class="tag">👥 賽跑對戰</span>
  </a>
  <a class="spot open" data-k="ferris" href="ferris.html" style="--c:#2f8fdb">
    <span class="icon">🎡</span><span class="name" data-zy>摩天輪</span><span class="tag">👤 乘法</span>
  </a>
  <a class="spot open" data-k="carousel" href="carousel.html" style="--c:#d1478f">
    <span class="icon">🎠</span><span class="name" data-zy>旋轉木馬</span><span class="tag">👤 認識時鐘</span>
  </a>
  <a class="spot open" data-k="ring" href="ring.html" style="--c:#14a99c">
    <span class="icon"><svg class="ringico" viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><rect x="27" y="10" width="10" height="20" rx="3" fill="#b9ece4"/><rect x="25.5" y="7" width="13" height="6" rx="2" fill="#7fd6c8"/><rect x="17" y="27" width="30" height="31" rx="10" fill="#b9ece4"/><circle cx="26" cy="42" r="2.2" fill="#1f2b33"/><circle cx="38" cy="42" r="2.2" fill="#1f2b33"/><path d="M28.5 47q3.5 3 7 0" stroke="#1f2b33" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="22" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><circle cx="42" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ff6b9a" stroke-width="5" transform="rotate(-10 32 24)"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ffd23f" stroke-width="5" stroke-dasharray="9 9" transform="rotate(-10 32 24)"/></svg></span><span class="name" data-zy>套圈圈</span><span class="tag">👤 九九快答</span>
  </a>
  <a class="spot open" data-k="balloon" href="balloon.html" style="--c:#e0477b">
    <span class="icon">🎈</span><span class="name" data-zy>射氣球</span><span class="tag">👤 加減法</span>
  </a>
  <a class="spot open" data-k="donut" href="donut.html" style="--c:#c2551f">
    <span class="icon">🍩</span><span class="name" data-zy>甜甜圈攤</span><span class="tag">👤 排排看乘法</span>
  </a>
  <a class="spot open" data-k="coaster" href="coaster.html" style="--c:#7a4fd6">
    <span class="icon">🎢</span><span class="name" data-zy>雲霄飛車</span><span class="tag">👤 計時挑戰</span>
  </a>
  <a class="spot open" data-k="fish" href="fish.html" style="--c:#f07a2a">
    <span class="icon">🐠</span><span class="name" data-zy>撈金魚</span><span class="tag">👤 找出全部</span>
  </a>
  <a class="spot open big" data-k="duel" href="duel.html" style="--c:#8e3fb0">
    <span class="icon">🎪</span><span class="name" data-zy>搶答對決</span><span class="tag">👥 加減法</span>
  </a>
</div>
<button type="button" class="zybtn" id="zyBtn" aria-pressed="true" data-zy-skip>ㄅㄆㄇ 注音<span class="sw" aria-hidden="true"></span><span class="st" id="zySt">開</span></button>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(()=>{
  // ---- 位置（百分比：x 是寬度 %、y 是高度 %）----
  // 環狀主路從入口往左繞一圈：售票亭 → 小火車 → 碰碰車 → 摩天輪 → 旋轉木馬 → 套圈圈 → 射氣球 → 甜甜圈攤 → 雲霄飛車 → 回到入口
  // 中間大道：入口 → 馬戲團（搶答對決）→ 旋轉木馬
  const map=document.querySelector(".map");
  // 環狀主路依序經過的設施（從入口往左繞一圈），中間是搶答對決
  const ORDER=["booth","train","bumper","ferris","carousel","ring","balloon","donut","coaster"];
  const LAYOUT={
    land:{gate:[50,82],pos:{booth:[31,74],train:[11,58],bumper:[11,26],ferris:[29,16],carousel:[50,11.5],ring:[71,16],balloon:[89,26],donut:[89,58],coaster:[69,74],duel:[50,47],fish:[30,45]},
      decos:[["🌲",79,44],["🌷",38,30],["🌼",62,30],["🌷",37,58],["🌼",63,58],["🌳",4,90],["🌲",15,90],["🎈",86,90],["🌳",96,90],["🦆",6,10]]},
    port:{gate:[50,88],pos:{booth:[28,80],train:[12,60],bumper:[12,35],ferris:[26,15],carousel:[50,10],ring:[74,15],balloon:[88,35],donut:[88,60],coaster:[72,80],duel:[50,45],fish:[30,47]},
      decos:[["🌲",72,47],["🌷",38,28],["🌼",62,28],["🌷",36,70],["🌼",64,70],["🌳",6,93],["🎈",94,93],["🦆",7,9]]}
  };
  const spots={};document.querySelectorAll(".spot").forEach(a=>spots[a.dataset.k]=a);
  const set=(el,x,y)=>{el.style.left=x+"%";el.style.top=y+"%"};
  // Catmull-Rom 轉成平滑的貝茲曲線（closed=true 時頭尾相接）
  function smooth(pts,closed){
    const n=pts.length,get=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
    let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=0;i<(closed?n:n-1);i++){
      const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d+(closed?" Z":"");
  }
  function layout(){
    const L=matchMedia("(orientation:portrait)").matches?LAYOUT.port:LAYOUT.land;
    Object.entries(L.pos).forEach(([k,[x,y]])=>set(spots[k],x,y));
    // 路線：入口 → 繞一圈回入口（環狀），再加一條入口 → 馬戲團 → 旋轉木馬的中間大道
    const S=p=>[p[0]*1.6,p[1]];
    const loop=[L.gate,...ORDER.map(k=>L.pos[k])].map(S);
    const g=S(L.gate),t=S(L.pos.carousel);
    const fp=L.pos.fish,lx=(L.pos.bumper[0]+L.pos.train[0])/2;
    // 叉路：左邊主路 → 撈金魚 → 中間大道
    const d=smooth(loop,true)+` M${g[0]} 104 L${g[0]} ${t[1]}`+` M${(lx*1.6).toFixed(1)} ${fp[1]} L${(fp[0]*1.6).toFixed(1)} ${fp[1]} L${g[0]} ${fp[1]}`;
    ["roadEdge","road","roadDash"].forEach(id=>document.getElementById(id).setAttribute("d",d));
    document.getElementById("decos").innerHTML=L.decos.map(([e,x,y])=>`<span class="deco" style="left:${x}%;top:${y}%">${e}</span>`).join("");
  }
  layout();
  matchMedia("(orientation:portrait)").addEventListener?.("change",layout);
  // 注音開關：存起來，所有小遊戲一起套用
  const zb=document.getElementById("zyBtn"),zs=document.getElementById("zySt");
  const syncZy=()=>{const on=window.parkZhuyin?parkZhuyin.isOn():true;zb.setAttribute("aria-pressed",on);zs.textContent=on?"開":"關";
    zb.setAttribute("aria-label",on?"注音：開，點一下關閉":"注音：關，點一下開啟")};
  zb.addEventListener("click",()=>{if(!window.parkZhuyin)return;parkZhuyin.set(!parkZhuyin.isOn());syncZy()});
  syncZy();addEventListener("pageshow",syncZy);
  // 彩色小旗
  const COLORS=["#ff6b6b","#ffd23f","#4dc3ff","#7bd389","#c58cff","#ff9f43"];
  document.querySelector(".bunting").innerHTML=Array.from({length:18},(_,i)=>`<i style="background:${COLORS[i%COLORS.length]}"></i>`).join("");
})();
</script>
</body>
</html>
