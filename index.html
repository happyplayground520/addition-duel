<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>數學遊樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 遊樂園導覽地圖：固定比例的地圖畫布，小路串起各個設施，點設施進入小遊戲 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1f2b33; --muted:#5d6b72;
  --sky:#bfe6ff; --grass:#9fd67a; --grass-dark:#86c463; --path:#f3e3bf; --path-edge:#e2cc98;
  --sign:#fffaf0; --lock:#9aa5ab;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{background:linear-gradient(var(--sky) 0 22%,var(--grass) 22%);color:var(--ink);font-family:var(--text);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.5vmin,14px);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h1{margin:0;font-size:clamp(28px,5.4vmin,54px);line-height:1.1;font-weight:800;letter-spacing:.06em;color:#fff;
  text-shadow:0 3px 0 #e0772b,0 6px 14px rgba(0,0,0,.18);display:flex;align-items:center;gap:.3em}
.sub{margin:0;font-size:clamp(16px,2.6vmin,22px);color:var(--ink);font-weight:700;opacity:.75}
/* 地圖畫布：橫向 16:10，直拿平板時縮小到寬度剛好 */
.map{position:relative;width:min(100%,calc((100dvh - 120px) * 1.6));aspect-ratio:16/10;
  background:radial-gradient(circle at 20% 30%,var(--grass-dark) 0 6%,transparent 6.5%),
             radial-gradient(circle at 75% 80%,var(--grass-dark) 0 5%,transparent 5.5%),var(--grass);
  border-radius:28px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.55),0 10px 30px rgba(0,0,0,.15);overflow:hidden}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:clamp(18px,4vmin,40px);transform:translate(-50%,-50%);pointer-events:none}
/* 設施 */
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-decoration:none;touch-action:manipulation}
.spot .icon{width:clamp(70px,14vmin,140px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:clamp(40px,8.5vmin,84px);background:#fff;box-shadow:0 6px 0 var(--c),0 10px 20px rgba(0,0,0,.18);
  border:5px solid var(--c);transition:transform .12s}
.spot:active .icon{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 var(--c),0 6px 12px rgba(0,0,0,.18)}
.spot:focus-visible .icon{outline:4px solid #fff;outline-offset:3px}
.spot .name{background:var(--sign);border:2px solid var(--c);border-radius:12px;padding:3px 12px;
  font-weight:800;font-size:clamp(14px,2.6vmin,24px);white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.spot .tag{white-space:nowrap;font-size:clamp(11px,1.8vmin,15px);font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px}
.spot.open .icon{animation:bob 2.4s ease-in-out infinite}
.spot.open:nth-of-type(2) .icon{animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.spot.locked{--c:var(--lock)}
.spot.locked .icon{filter:grayscale(1);opacity:.6}
.spot.locked .tag::before{content:"🚧 "}
.spot.locked .tag{background:#f2b705;color:var(--ink)}
.spot.locked .icon::after{content:"🚧";position:absolute;right:-6px;bottom:-4px;font-size:.5em}
.spot .icon{position:relative}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:17px;font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .25s;white-space:nowrap}
.toast[hidden]{display:block;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.spot.open .icon{animation:none}}
/* 設施大小跟著地圖寬度縮放，小螢幕也不會擠在一起 */
@supports (container-type:inline-size){
  .map{container-type:inline-size}
  .spot .icon{width:clamp(40px,11.5cqw,160px);font-size:clamp(22px,7cqw,96px);border-width:clamp(3px,.5cqw,6px)}
  .spot .name{font-size:clamp(13px,2.8cqw,34px);padding:2px clamp(6px,1.2cqw,14px)}
  .spot .tag{font-size:clamp(11px,1.9cqw,22px);padding:1px clamp(5px,1cqw,12px)}
  .deco{font-size:clamp(14px,3.4cqw,40px)}
}
/* 直拿平板：地圖改成直的，把畫面填滿 */
@media (orientation:portrait){
  .map{aspect-ratio:4/5;width:min(100%,calc((100dvh - 140px) * .8))}
}
/* 手機橫放：標題縮小，讓地圖大一點 */
@media (max-height:500px){
  h1{font-size:24px} .sub{display:none}
  .map{width:min(100%,calc((100dvh - 56px) * 1.6))}
}
</style>
</head>
<body>
<h1>🎪 數學遊樂園</h1>
<p class="sub">點一個設施開始玩</p>

<div class="map" role="navigation" aria-label="遊樂園地圖">
  <svg viewBox="0 0 160 100" preserveAspectRatio="none" aria-hidden="true">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="roadEdge" stroke="var(--path-edge)" stroke-width="9"/>
      <path id="road" stroke="var(--path)" stroke-width="7"/>
      <path id="roadDash" stroke="#fff" stroke-width=".6" stroke-dasharray="2 3" opacity=".8"/>
    </g>
  </svg>
  <span class="deco" style="left:5%;top:12%">🌳</span>
  <span class="deco" style="left:20%;top:90%">🌳</span>
  <span class="deco" style="left:96%;top:44%">🌲</span>
  <span class="deco" style="left:44%;top:58%">🌷</span>
  <span class="deco" style="left:6%;top:86%">🌼</span>
  <span class="deco" style="left:96%;top:90%">🎈</span>
  <span class="deco" style="left:66%;top:8%">☁️</span>

  <a class="spot open" href="duel.html" style="--c:#7a3fa0">
    <span class="icon">🎪</span><span class="name">搶答對決</span><span class="tag">2 人・加減法</span>
  </a>
  <a class="spot open" href="balloon.html" style="--c:#e0477b">
    <span class="icon">🎈</span><span class="name">射氣球</span><span class="tag">1 人・加減法</span>
  </a>
  <a class="spot open" href="carousel.html" style="--c:#d1478f">
    <span class="icon">🎠</span><span class="name">旋轉木馬</span><span class="tag">1 人・認識時鐘</span>
  </a>
  <a class="spot open" href="ferris.html" style="--c:#2f8fdb">
    <span class="icon">🎡</span><span class="name">摩天輪</span><span class="tag">1 人・乘法</span>
  </a>
  <a class="spot open" href="booth.html" style="--c:#e0772b">
    <span class="icon">🎟️</span><span class="name">售票亭</span><span class="tag">1 人・認識錢幣</span>
  </a>
  <a class="spot open" href="donut.html" style="--c:#c2551f">
    <span class="icon">🍩</span><span class="name">甜甜圈攤</span><span class="tag">1 人・排排看乘法</span>
  </a>
  <a class="spot open" href="ring.html" style="--c:#1fb5a8">
    <span class="icon">🎯</span><span class="name">套圈圈</span><span class="tag">1 人・九九快答</span>
  </a>
  <a class="spot open" href="coaster.html" style="--c:#7a4fd6">
    <span class="icon">🎢</span><span class="name">雲霄飛車</span><span class="tag">1 人・計時</span>
  </a>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(()=>{
  // ---- 路線與設施位置（百分比座標：x 是寬度 %、y 是高度 %）----
  // 主路：入口 → 售票亭 → 搶答對決 → 摩天輪 → 旋轉木馬 → 套圈圈 → 射氣球 → 雲霄飛車 → 回到入口
  // 叉路：旋轉木馬 → 甜甜圈攤 → 雲霄飛車（穿過遊樂園中間）
  const SPOTS={"booth.html":[34,80],"duel.html":[13,60],"ferris.html":[28,30],"carousel.html":[50,18],
    "ring.html":[84,22],"balloon.html":[87,64],"coaster.html":[58,82],"donut.html":[68,46]};
  document.querySelectorAll(".spot[href]").forEach(a=>{const p=SPOTS[a.getAttribute("href")];if(p){a.style.left=p[0]+"%";a.style.top=p[1]+"%"}});
  const P=k=>[SPOTS[k][0]*1.6,SPOTS[k][1]];   // 轉成 160×100 的路線座標
  const main=[[80,104],P("booth.html"),P("duel.html"),P("ferris.html"),P("carousel.html"),P("ring.html"),P("balloon.html"),P("coaster.html"),[80,104]];
  const branch=[P("carousel.html"),P("donut.html"),P("coaster.html")];
  // Catmull-Rom 轉成平滑的貝茲曲線
  function smooth(pts){
    let d=`M${pts[0][0]} ${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      d+=` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d;
  }
  const d=smooth(main)+" "+smooth(branch);
  ["roadEdge","road","roadDash"].forEach(id=>document.getElementById(id).setAttribute("d",d));

  const toast=document.getElementById("toast");let t=null;
  document.querySelectorAll(".spot.locked").forEach(b=>b.addEventListener("click",()=>{
    toast.textContent=`${b.dataset.name}正在建造中，敬請期待！🚧`;toast.hidden=false;
    clearTimeout(t);t=setTimeout(()=>toast.hidden=true,2200);
  }));
})();
</script>
</body>
</html>
