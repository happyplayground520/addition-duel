<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>選地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">
<style>
/* 選地圖：打開網站的第一個畫面。四張地圖卡片，右上角是注音開關（所有地圖一起套用），左上角 ❓ 看使用說明 */
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#1f2b33;--muted:#5d6b72;--text:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color-scheme:light}
html,body{margin:0;min-height:100%}
body{font-family:var(--text);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle,rgba(255,255,255,.55) 2px,transparent 2.5px) 0 0/38px 38px,linear-gradient(#bfe7ff,#e9f6ff 55%,#fff6e6);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vmin,30px);
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.topbar{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.topbar>*{pointer-events:auto}
.help{width:52px;height:52px;border-radius:16px;border:0;background:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #b9dff5,0 8px 16px rgba(0,0,0,.1)}
/* 注音開關（和以前數學遊樂園右上角的一樣） */
.zybtn{display:flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:17px;color:var(--ink);background:#fff;border:0;border-radius:999px;
  padding:6px 8px 6px 14px;cursor:pointer;box-shadow:0 4px 0 #b9dff5,0 8px 16px rgba(0,0,0,.1);min-height:48px}
.zybtn .sw{position:relative;width:52px;height:30px;border-radius:999px;background:#cfd8dc;transition:background .2s}
.zybtn .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.zybtn[aria-pressed="true"] .sw{background:#1f9d61}
.zybtn[aria-pressed="true"] .sw::after{transform:translateX(22px)}
.zybtn .st{min-width:1.2em;color:var(--muted)}
h1{margin:0;font-size:clamp(28px,5.4vmin,50px);font-weight:900;letter-spacing:.08em;color:#fff;padding:.16em .9em .2em;border-radius:999px;border:4px solid #fff;
  background:linear-gradient(90deg,#ff7a7a,#ffb347,#6cc6ff,#8f7bff);text-shadow:0 3px 0 rgba(0,0,0,.18);box-shadow:0 6px 0 rgba(0,0,0,.12),0 12px 22px rgba(0,0,0,.12)}
/* 四張地圖卡片 */
.maps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,2.4vmin,24px);width:min(1100px,100%)}
.card{--c:#e8434f;display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(14px,2.6vmin,24px) 12px clamp(14px,2.4vmin,22px);border-radius:28px;
  text-decoration:none;color:var(--ink);background:#fff;border:5px solid #fff;box-shadow:0 0 0 4px var(--c),0 10px 0 color-mix(in srgb,var(--c) 70%,#000),0 16px 24px rgba(0,0,0,.14);
  transition:transform .15s;animation:cin .5s cubic-bezier(.3,1.5,.5,1) both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}
@keyframes cin{from{transform:translateY(24px) scale(.9);opacity:0}}
.card:active{transform:translateY(5px)}
.card .pic{width:clamp(86px,15vmin,150px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff 0 50%,color-mix(in srgb,var(--c) 18%,#fff));animation:bob 2.8s ease-in-out infinite}
.card:nth-child(2n) .pic{animation-delay:-1.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
.card .pic svg{width:80%;height:80%;display:block;overflow:visible}
.card h2{margin:0;font-size:clamp(20px,3.2vmin,30px);font-weight:900;color:var(--c);white-space:nowrap}
.card .tags{margin:0;display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:100%}
.card .tags>span{white-space:nowrap;font-size:clamp(13px,1.8vmin,17px);font-weight:800;color:color-mix(in srgb,var(--c) 70%,#000);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:999px;padding:1px 10px}
.card.park{--c:#e8434f}.card.town{--c:#e8577a}.card.cove{--c:#2f6fdb}.card.sky{--c:#6a4fd6}
/* 使用說明 */
.panel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(31,43,51,.35);overflow-y:auto}
.box{background:#fffdf6;border:5px solid #fff;box-shadow:0 0 0 4px #6cc6ff,0 18px 40px rgba(0,0,0,.25);border-radius:28px;padding:22px clamp(18px,4vmin,34px);
  width:min(460px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;animation:cin .4s cubic-bezier(.3,1.5,.5,1)}
.box h2{margin:0;font-size:clamp(24px,4vmin,32px);font-weight:900}
.box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%}
.box li{display:flex;align-items:center;gap:12px;font-size:clamp(18px,2.8vmin,22px);font-weight:800;background:#fff;border-radius:16px;padding:8px 14px;box-shadow:inset 0 0 0 2px #e3eef5}
.box li .e{font-size:28px;flex:none;width:36px;text-align:center}
.box .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:800;border:2px solid #e3d3b8;border-radius:14px;padding:8px 14px;cursor:pointer;background:#fff;min-height:48px}
.chk input{width:22px;height:22px}
.big{font:inherit;font-weight:900;font-size:22px;border:0;border-radius:999px;padding:.4em 1.6em;cursor:pointer;color:#fff;background:#1f9d61;box-shadow:0 5px 0 #136b41;min-height:52px}
.sayb{font:inherit;font-size:24px;width:52px;height:52px;border-radius:16px;border:3px solid #ffd23f;background:#fff8d6;cursor:pointer}
/* 平板直放、手機：兩欄 */
@media (max-width:820px),(orientation:portrait){.maps{grid-template-columns:repeat(2,minmax(0,1fr));width:min(640px,100%)}}
@media (max-width:600px){body{justify-content:flex-start;padding-top:max(74px,calc(env(safe-area-inset-top,0px) + 70px))}
  h1{font-size:26px}.card{padding:12px 8px 14px;border-radius:22px;gap:6px}.card .pic{width:84px}.card h2{font-size:19px}.card .tags>span{font-size:13px;padding:1px 7px}.maps{gap:16px 14px}}
/* 手機橫放：一排四張、小一點 */
@media (max-height:500px) and (orientation:landscape){body{gap:10px;padding-top:max(12px,env(safe-area-inset-top,0px))}h1{font-size:22px;border-width:3px}
  .maps{grid-template-columns:repeat(4,minmax(0,1fr));width:min(860px,calc(100% - 140px))}.card{padding:10px 6px 12px;gap:4px}.card .pic{width:70px}.card h2{font-size:17px}.card .tags>span{font-size:12px;padding:0 6px}}
@media (prefers-reduced-motion:reduce){.card,.card .pic,.box{animation:none}}
</style>
<script src="zhuyin.js?v=20261119l"></script>
<script src="en.js?v=20261119l"></script>
</head>
<body>
<div class="topbar">
  <button type="button" class="help" id="helpBtn" aria-label="使用說明">❓</button>
  <button type="button" class="zybtn" id="zyBtn" aria-pressed="true" data-zy-skip>ㄅㄆㄇ 注音<span class="sw" aria-hidden="true"></span><span class="st" id="zySt">開</span></button>
</div>
<h1>選地圖</h1>
<nav class="maps" aria-label="選一張地圖">

      <path d="M50 46 30 92M50 46l20 46M24 92h52" fill="none"/>
      <circle cx="50" cy="46" r="32" fill="#fff6d6"/><path d="M50 14v64M18 46h64M27 23l46 46M73 23 27 69" fill="none" stroke-width="2.5"/>
      <circle cx="50" cy="46" r="6" fill="#ffd23f"/>
      <g stroke-width="3"><rect x="43" y="6" width="14" height="12" rx="4" fill="#ff6b6b"/><rect x="74" y="40" width="14" height="12" rx="4" fill="#4dc3ff"/><rect x="43" y="74" width="14" height="12" rx="4" fill="#7bd389"/><rect x="12" y="40" width="14" height="12" rx="4" fill="#c58cff"/>
      <rect x="65" y="16" width="13" height="11" rx="4" fill="#ffd23f"/><rect x="65" y="64" width="13" height="11" rx="4" fill="#ff9f43"/><rect x="22" y="64" width="13" height="11" rx="4" fill="#ff8fc7"/><rect x="22" y="16" width="13" height="11" rx="4" fill="#4dd6c1"/></g></g></svg></span>

  </a>
  <a class="card town" href="town.html">
    <span class="pic"><svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#3a2a22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><ellipse cx="50" cy="87" rx="43" ry="7" fill="#d7f0ff"/><rect x="14" y="52" width="72" height="31" rx="7" fill="#fff6ea"/><path d="M15 68h70" fill="none" stroke="#ff7a9a" stroke-width="5"/><path d="M14 61q0-10 10-10h52q10 0 10 10q-5 7-10 0q-6 7-12 0q-6 7-12 0q-6 7-12 0q-6 7-12 0q-5 7-10 0z" fill="#fff"/><path id="sb" d="M50 40.5q-9.4-5 -9.4-12q0-6 9.4-6t9.4 6q0 7-9.4 12z" fill="#ff4b55" stroke-width="2.5"/><path d="M41 23l3.5 4 3-3 3 3 3.5-4q-6.5 5-13 0z" fill="#46c46a" stroke="#2c7a3e" stroke-width="1.6"/>
      <path d="M32 45q-9-5-9-12q0-6 9-6t9 6q0 7-9 12z" fill="#ff4b55" stroke-width="2.5"/><path d="M25 28l3.5 4 3-3 3 3 3.5-4q-6.5 5-13 0z" fill="#46c46a" stroke="#2c7a3e" stroke-width="1.6"/>
      <path d="M68 45q-9-5-9-12q0-6 9-6t9 6q0 7-9 12z" fill="#ff4b55" stroke-width="2.5"/><path d="M61 28l3.5 4 3-3 3 3 3.5-4q-6.5 5-13 0z" fill="#46c46a" stroke="#2c7a3e" stroke-width="1.6"/>
      <g fill="#ffe27a" stroke="none"><circle cx="46" cy="30" r="1.4"/><circle cx="53" cy="29" r="1.4"/><circle cx="50" cy="34" r="1.4"/><circle cx="29" cy="35" r="1.4"/><circle cx="35" cy="38" r="1.4"/><circle cx="65" cy="35" r="1.4"/><circle cx="71" cy="38" r="1.4"/></g></g></svg></span>

  <a class="card sky" href="sky.html">
    <span class="pic"><svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="#3a2a22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">

      <path d="M86 62q14-8-2-10" fill="none" stroke="#ffb347" stroke-width="6"/><path d="M22 72q-8 0-8-10" fill="none" stroke="#ffb347" stroke-width="6"/>
      <path d="M80 12l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#ffd23f" stroke-width="2.5"/><path d="M16 18l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8z" fill="#ffd23f" stroke-width="2"/></g></svg></span>
    <h2>謎題星空</h2><p class="tags"><span data-zy>規律</span><span data-zy>數獨</span><span data-zy>邏輯推理</span></p>
  </a>
</nav>

<section class="panel" id="intro" hidden>
  <div class="box" role="dialog" aria-labelledby="introT">
    <h2 id="introT">👋 歡迎來玩！</h2>
    <ul>
      <li><span class="e">🗺️</span><span data-zy>點一張地圖開始玩</span></li>
      <li><span class="e">🔊</span><span data-zy>每一關都可以聽說明</span></li>
      <li><span class="e" data-zy-skip>ㄅ</span><span data-zy>注音在右上角開關</span></li>
    </ul>
    <div class="row"><button type="button" class="sayb" id="introSay" aria-label="念說明">🔊</button><label class="chk"><input type="checkbox" id="introNo"><span data-zy>下次不要再出現</span></label></div>
    <button type="button" class="big" id="introOk">OK</button>
  </div>
</section>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
  // 注音開關：存起來，四張地圖、所有關卡一起套用
  const zb=$("zyBtn"),zs=$("zySt");
  const syncZy=()=>{const on=window.parkZhuyin?parkZhuyin.isOn():true;zb.setAttribute("aria-pressed",on);zs.textContent=on?"開":"關";
    zb.setAttribute("aria-label",on?"注音：開，點一下關閉":"注音：關，點一下開啟")};
  zb.addEventListener("click",()=>{if(!window.parkZhuyin)return;parkZhuyin.set(!parkZhuyin.isOn());syncZy()});
  syncZy();addEventListener("pageshow",syncZy);
  // 使用說明：第一次進來自動打開；勾「下次不要再出現」就不再自動打開，按 ❓ 隨時可以再看
  const TXT="歡迎來玩！點一張地圖開始玩。每一關都可以按喇叭聽說明。注音在右上角開關。";
  const open=()=>{$("intro").hidden=false};
  const close=()=>{if($("introNo").checked)pref("hub-intro","off");$("intro").hidden=true;window.EN&&EN.stop&&EN.stop()};
  $("helpBtn").onclick=()=>{$("introNo").checked=pref("hub-intro")==="off";open()};
  $("introOk").onclick=close;
  $("intro").addEventListener("click",e=>{if(e.target===$("intro"))close()});
  $("introSay").onclick=()=>{window.EN&&EN.say(TXT,{zh:true})};
  if(pref("hub-intro")!=="off")open();
})();
</script>
</body>
</html>
