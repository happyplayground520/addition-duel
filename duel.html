<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<script src="zhuyin.js?v=20261119g"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&display=swap">

<script src="park.js?v=20261119g"></script>
<style>:root{--theme:#8e3fb0}</style>
</head>
<body>
<title>加減法搶答對決</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: 平板平放，上下兩半是兩位玩家的按鍵區（上半部旋轉 180°）；正中間是加高的題目區，正反兩行題目分別貼在上緣與下緣；設定收在左側抽屜選單 */
:root{
  --bg:#eef3f1;
  --ink:#1f2b33;
  --muted:#66757d;
  --p1:#2f6fdb; --p1-soft:#dbe7fb;
  --p2:#e0772b; --p2-soft:#fbe6d6;
  --good:#1f9d61; --bad:#d23c3c;
  --key:#ffffff;
  --band:#2a1430; --band-ink:#fff6e6; --band-line:#6b4377; --band-soft:#46244f;
  --curtain:#c8253b; --curtain-dark:#8a1022; --gold:#f5c542;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.board{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr)}

/* ---- 玩家區 ---- */
.side{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(6px,1.4vmin,14px);min-height:0;
  padding-block:clamp(10px,2vmin,18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side.p1{--c:var(--p1);--soft:var(--p1-soft);background:linear-gradient(to top,var(--p1-soft),var(--bg))}
.side.p2{--c:var(--p2);--soft:var(--p2-soft);background:linear-gradient(to top,var(--p2-soft),var(--bg));transform:rotate(180deg)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-weight:700;font-size:clamp(16px,2.6vmin,24px);color:var(--c);display:flex;align-items:center;gap:8px;white-space:nowrap}
.name::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c)}
.msg{flex:1;text-align:center;font-size:clamp(15px,2.6vmin,24px);font-weight:700;color:var(--muted);min-width:0}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.score{font-family:var(--num);font-weight:800;font-size:clamp(22px,4vmin,40px);line-height:1;color:var(--c);
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.score small{font-family:var(--text);font-size:.45em;color:var(--muted);font-weight:600}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.35)}}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(6px,1.2vmin,12px);align-content:center;min-height:0}
@media (orientation:landscape) and (min-width:700px){.pad{grid-template-columns:repeat(11,minmax(0,1fr))}}
.pad.wide{grid-template-columns:repeat(7,minmax(0,1fr))}
.pad.wide .key{font-size:clamp(20px,4vmin,40px)}
@media (orientation:landscape) and (min-width:700px){.pad.wide{grid-template-columns:repeat(11,minmax(0,1fr))}}
.pad.choices,.pad.choices.wide{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){.pad.choices{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pad.choices .key{font-size:clamp(32px,7vmin,70px);max-height:min(140px,20vmin)}
.key{font-family:var(--num);font-weight:800;font-size:clamp(24px,5.2vmin,54px);line-height:1;
  min-height:44px;height:100%;max-height:min(110px,15vmin);border:0;border-radius:16px;background:var(--key);color:var(--ink);
  box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#c9d2d6);cursor:pointer;touch-action:manipulation;transition:transform .06s,background .15s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 45%,#c9d2d6)}
.key:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.key.wrong{background:var(--bad);color:#fff;animation:shake .35s}
.key.right{background:var(--good);color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.side.locked .pad{opacity:.4;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vmin,12px);overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 90%,transparent);text-align:center;padding:16px}
.overlay h2{margin:0;font-size:clamp(26px,6vmin,56px);color:var(--c);text-wrap:balance}
.overlay p{margin:0;font-size:clamp(15px,2.6vmin,22px);color:var(--muted)}
.final{display:flex;gap:clamp(10px,2.4vmin,24px);align-items:stretch}
.final[hidden]{display:none}
.card{min-width:clamp(96px,17vmin,170px);padding:clamp(8px,1.6vmin,14px) clamp(14px,2.6vmin,26px);border-radius:18px;
  background:var(--k-soft);border:3px solid var(--k);display:flex;flex-direction:column;align-items:center;gap:4px}
.card .who{font-weight:800;font-size:clamp(15px,2.6vmin,22px);color:var(--k);display:flex;align-items:center;gap:6px}
.card .who::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--k)}
.card .pts{font-family:var(--num);font-weight:800;font-size:clamp(40px,9vmin,84px);line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums}
.card .pts small{font-family:var(--text);font-size:.32em;color:var(--muted);margin-left:4px}
.card.k1{--k:var(--p1);--k-soft:var(--p1-soft)} .card.k2{--k:var(--p2);--k-soft:var(--p2-soft)}
.card.win{box-shadow:0 0 0 5px color-mix(in srgb,var(--k) 25%,transparent)}
.ready{font-family:var(--text);font-weight:800;font-size:clamp(20px,4vmin,36px);border:0;border-radius:999px;
  padding:.5em 1.4em;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.ready:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.ready.on{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 60%,#000)}
/* 準備卡片：各自選難度、語音 */
.overlay .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.homeb{display:grid;place-items:center;min-width:64px;font-size:30px;line-height:1;padding:8px 14px;border:2px solid #cfd8dc;background:#fff;
  border-radius:14px;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.endrow{align-items:center;gap:12px!important}
.overlay .row[hidden],.overlay p[hidden]{display:none}
.overlay h2{font-size:clamp(24px,4.6vmin,46px)}
.overlay p{font-size:clamp(14px,2.2vmin,19px)}
@media (max-height:820px){.overlay .opt small{display:inline;margin-left:4px}}
/* 橫放時玩家區比較矮：難度、語音、準備好了排成一行 */
@media (orientation:landscape){
  .overlay{flex-direction:row;flex-wrap:wrap;align-content:center;column-gap:clamp(10px,2vmin,20px)}
  .overlay h2,.overlay p{width:100%}
  .overlay p{order:9}
  .overlay h2{font-size:clamp(22px,4vmin,40px)}
}
.overlay .opt{font:inherit;font-size:clamp(15px,2.4vmin,19px);font-weight:700;border:2px solid #cfd8dc;background:#fff;border-radius:14px;
  padding:8px 14px;cursor:pointer;color:var(--ink)}
.overlay .opt small{display:block;font-size:.72em;font-weight:600;opacity:.75}
.overlay .opt[aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#fff}
.lvtag{font-size:clamp(13px,2.2vmin,19px);font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px;white-space:nowrap}
.spk{width:clamp(44px,6.5vmin,56px);height:clamp(44px,6.5vmin,56px);border-radius:14px;border:2px solid var(--c);background:#fff;
  font-size:clamp(22px,3.4vmin,28px);cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.spk.off{opacity:.45}
.head .left{display:flex;align-items:center;gap:10px;min-width:0}

/* ---- 中間題目區 ---- */
.band{background:var(--band);color:var(--band-ink);display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  min-height:0;padding-block:clamp(10px,2.2vmin,22px);
  padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}
.q{font-family:var(--num);font-weight:800;line-height:1;font-size:clamp(56px,12.5vmin,150px);
  display:flex;gap:.16em;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .op{color:#9fb0b8;font-weight:600}
.q .ans{min-width:1.15em;text-align:center;border-radius:.18em;padding:0 .1em;background:var(--band-soft);color:#ffd75e}
.q .ans.ok{background:var(--good);color:#fff}
.qwrap{display:flex;justify-content:center;width:100%;min-height:0}
.qwrap.flip{transform:rotate(180deg)}
.qwrap.pop{animation:pop .35s}
.qwrap.flip.pop{animation:popflip .35s}
.wq{display:none;flex-direction:column;align-items:center;gap:clamp(4px,.9vmin,10px);text-align:center;max-width:min(100%,34em)}
.band.word .wq{display:flex}
.band.word .q{display:none}
.word-mode .board{grid-template-rows:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1fr)}
.sent{margin:0;font-weight:800;font-size:clamp(22px,4.2vmin,44px);line-height:1.5;text-wrap:balance}
.wrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,20px);flex-wrap:wrap}
.pics{margin:0;font-size:clamp(18px,3.2vmin,34px);line-height:1.15;letter-spacing:.05em;word-break:break-all}
/* 注音：每個字右邊一小排直式注音，聲調在右上（和聖誕單字遊戲同一種排法） */
.zy{display:inline-flex;align-items:center;vertical-align:middle;line-height:1;margin-right:.08em}
.zy .b{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;margin-left:.06em;
  font-family:var(--text);font-weight:400;font-size:max(.38em,12px);line-height:1.02;letter-spacing:0;color:#cfe0e6}
.zy .b>span{position:relative;display:block}
.zy .t{position:absolute;left:92%;top:-.45em;font-size:1em}
.zy .lt{line-height:.7}
.band.nopics .pics{display:none}
.wans{font-family:var(--num),var(--text);font-weight:800;font-size:clamp(18px,3.2vmin,32px);line-height:1.2;
  border-radius:999px;padding:.1em .8em;background:var(--band-soft);color:#ffd75e;font-variant-numeric:tabular-nums}
.wans.ok{background:var(--good);color:#fff}
/* ---- 馬戲團舞台：兩側紅布幕、上下垂邊、跑馬燈泡、搖擺的聚光燈 ---- */
.band{position:relative;overflow:hidden;
  background:radial-gradient(ellipse 45% 70% at 50% 50%,rgba(255,214,120,.16),transparent 70%),var(--band)}
.band>.qwrap,.band>.mid{position:relative;z-index:2}
.stage{position:absolute;inset:0;pointer-events:none;z-index:1}
/* 左右布幕：一條條皺褶，中間用金色繩子綁起來 */
.curtain{position:absolute;top:0;bottom:0;width:clamp(44px,7vmin,64px);
  background:repeating-linear-gradient(90deg,var(--curtain-dark) 0 3px,var(--curtain) 3px 11px,#e04358 11px 14px,var(--curtain) 14px 18px);
  box-shadow:0 0 18px rgba(0,0,0,.45)}
.curtain.l{left:0;clip-path:polygon(0 0,100% 0,62% 50%,100% 100%,0 100%)}
.curtain.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 50%)}
.curtain::after{content:"";position:absolute;top:calc(50% - 5px);height:10px;width:70%;border-radius:5px;
  background:linear-gradient(var(--gold),#c9961c)}
.curtain.l::after{left:0} .curtain.r::after{right:0}
/* 上下垂邊（扇形布邊） */
.valance{position:absolute;left:0;right:0;height:16px;background-size:32px 16px;background-repeat:repeat-x}
.valance.top{top:0;background-image:radial-gradient(circle at 50% 0,var(--curtain) 15px,var(--gold) 15.5px 16.5px,transparent 17px)}
.valance.bot{bottom:0;background-image:radial-gradient(circle at 50% 100%,var(--curtain) 15px,var(--gold) 15.5px 16.5px,transparent 17px)}
/* 跑馬燈泡：兩排錯開，輪流亮 */
.bulbs{position:absolute;left:clamp(44px,7vmin,64px);right:clamp(44px,7vmin,64px);height:10px;
  background-image:radial-gradient(circle,#fff3b0 0 3px,rgba(255,220,90,.55) 3.5px,transparent 6px);background-size:28px 10px;background-repeat:repeat-x}
.bulbs.top{top:20px} .bulbs.bot{bottom:20px}
.bulbs.b{background-position:14px 0;animation:twinkle 1.2s steps(1) infinite}
.bulbs.a{animation:twinkle 1.2s steps(1) infinite reverse}
@keyframes twinkle{50%{opacity:.25}}
/* 聚光燈：從兩邊斜照進舞台，慢慢擺動 */
.beam{position:absolute;top:-30%;width:28%;height:160%;mix-blend-mode:screen;filter:blur(6px);opacity:.55;
  background:linear-gradient(rgba(255,240,190,.55),rgba(255,240,190,0) 85%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%)}
.beam.l{left:10%;transform-origin:50% 0;animation:sway 7s ease-in-out infinite}
.beam.r{right:10%;transform-origin:50% 0;animation:sway 7s ease-in-out infinite reverse}
@keyframes sway{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(18deg)}}
/* 答對時舞台閃一下 */
.band.flash .beam{opacity:.95;transition:opacity .15s}
.band.flash .bulbs{animation-duration:.25s}
/* 兩邊玩家區：淡淡的馬戲團帳篷條紋 */
.side::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(200,37,59,.07) 0 44px,transparent 44px 88px)}
.side>*{position:relative}
.side>.overlay{position:absolute}
@media (prefers-reduced-motion:reduce){.beam,.bulbs{animation:none!important}}
@keyframes pop{from{transform:scale(.8);opacity:.3}}
@keyframes popflip{from{transform:rotate(180deg) scale(.8);opacity:.3}}
.mid{display:flex;align-items:center;gap:12px;width:100%;color:#9fb0b8}
.mid::before,.mid::after{content:"";flex:1;height:1px;background:var(--band-line)}
.round{font-family:var(--num);font-weight:800;font-size:clamp(14px,2.4vmin,22px);font-variant-numeric:tabular-nums;
  border:1px solid var(--band-line);border-radius:999px;padding:2px 14px;white-space:nowrap}

/* ---- 左側選單 ---- */
.menu-btn{position:fixed;z-index:20;left:calc(env(safe-area-inset-left,0px) + 10px);top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:12px;border:1px solid var(--band-line);background:var(--band-soft);color:var(--band-ink);
  font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
/* 選單按鈕上下各一顆：上面 ☰ 設定、下面 🏠 回遊樂園 */
.menu-btn{transform:translateY(calc(-100% - 6px))}
.home-btn{position:fixed;z-index:20;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(50% + 6px);
  width:44px;height:44px;border-radius:12px;border:1px solid var(--band-line);background:var(--band-soft);
  font-size:22px;line-height:1;display:grid;place-items:center;text-decoration:none}
.home-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.menu-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 新手導覽：指向左側選單按鈕的提示卡 */
.menu-btn.pulse{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,60,.85)}100%{box-shadow:0 0 0 16px rgba(255,200,60,0)}}
.tour{position:fixed;z-index:25;left:calc(env(safe-area-inset-left,0px) + 70px);top:calc(50% - 28px);transform:translateY(-50%);
  width:min(320px,calc(100vw - 96px));background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
.tour[hidden]{display:none}
.tour::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  border:10px solid transparent;border-left:0;border-right-color:#fff}
.tour h3{margin:0;font-size:18px}
.tour p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
.tour .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tour label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.tour input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.tour .ok{font-family:var(--text);font-weight:800;font-size:16px;border:0;border-radius:999px;padding:.45em 1.2em;
  background:var(--ink);color:#fff;cursor:pointer}
.scrim{position:fixed;inset:0;z-index:29;background:rgba(15,22,27,.35)}
.drawer{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(300px,82vw);background:#fff;color:var(--ink);
  box-shadow:4px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .22s ease;
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between}
.drawer h2{margin:0;font-size:20px}
.drawer .x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.group{display:flex;flex-direction:column;gap:10px}
.group .lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.group .note{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.drawer button.opt{font:inherit;font-size:16px;font-weight:700;border:1.5px solid #cfd8dc;background:#fff;color:var(--ink);
  border-radius:12px;padding:10px 16px;cursor:pointer;min-width:56px}
.drawer button.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.drawer button.opt:disabled{opacity:.45;cursor:not-allowed}
.drawer button.wide{width:100%;text-align:left}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;border:1.5px solid #cfd8dc;border-radius:12px;
  padding:10px 14px;cursor:pointer;background:#fff;color:var(--ink)}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--ink)}
.chk:has(input:checked){border-color:var(--ink);background:#eef3f1}
.chk:has(input:disabled){opacity:.45;cursor:not-allowed}
.pics .gone{position:relative;display:inline-block;opacity:.4}
.pics .gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#ff6b6b;font-weight:800;opacity:1}
.lbl2{font-size:14px;font-weight:700;color:var(--ink);margin-top:4px}
.sel{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid #cfd8dc;background:#fff;color:var(--ink)}
.sel:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
.drawer button:focus-visible{outline:3px solid var(--p1);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="board">
  <section class="side p2" data-p="1" aria-label="玩家 2"></section>
  <div class="band">
    <div class="stage" aria-hidden="true">
      <div class="beam l"></div><div class="beam r"></div>

<script>
(function(){

    {t:(a,b)=>`盤子上有${a}塊餅乾和${b}塊蛋糕，總共有幾塊點心？`,ea:"🍪",eb:"🍰"},
    {t:(a,b)=>`停車場有${a}輛汽車和${b}輛公車，總共有幾輛車？`,ea:"🚗",eb:"🚌"},
    {t:(a,b)=>`書架上有${a}本故事書和${b}本圖畫書，總共有幾本書？`,ea:"📕",eb:"📗"},
    {t:(a,b)=>`天上有${a}顆星星，又出現了${b}顆，現在有幾顆星星？`,ea:"⭐",eb:"⭐"},

    {t:(a,b)=>`小美先吃了${a}顆草莓，又吃了${b}顆，總共吃了幾顆草莓？`,ea:"🍓",eb:"🍓"},

    {t:(a,b)=>`桌上有${a}個紅氣球和${b}個藍氣球，總共有幾個氣球？`,ea:"🎈",eb:"🔵"}
  ];
  // 減法應用題：拿走、飛走、吃掉……還剩下幾個
  const TPL_SUB=[
    {t:(a,b)=>`樹上有${a}隻小鳥，飛走了${b}隻，還剩下幾隻小鳥？`,e:"🐦"},
    {t:(a,b)=>`籃子裡有${a}顆蘋果，吃掉了${b}顆，還剩下幾顆蘋果？`,e:"🍎"},
    {t:(a,b)=>`盤子上有${a}塊餅乾，小明吃了${b}塊，還剩下幾塊餅乾？`,e:"🍪"},
    {t:(a,b)=>`池塘裡有${a}隻青蛙，跳走了${b}隻，還剩下幾隻青蛙？`,e:"🐸"},
    {t:(a,b)=>`桌上有${a}個氣球，破了${b}個，還剩下幾個氣球？`,e:"🎈"},
    {t:(a,b)=>`花園裡開了${a}朵花，媽媽摘了${b}朵，還剩下幾朵花？`,e:"🌼"},
    {t:(a,b)=>`停車場有${a}輛汽車，開走了${b}輛，還剩下幾輛汽車？`,e:"🚗"},
    {t:(a,b)=>`小美有${a}枝鉛筆，送給弟弟${b}枝，還剩下幾枝鉛筆？`,e:"✏️"},
    {t:(a,b)=>`書架上有${a}本書，借走了${b}本，還剩下幾本書？`,e:"📕"},
    {t:(a,b)=>`農場裡有${a}隻小雞，跑走了${b}隻，還剩下幾隻小雞？`,e:"🐥"},
    {t:(a,b)=>`小狗有${a}根骨頭，吃掉了${b}根，還剩下幾根骨頭？`,e:"🦴"},
    {t:(a,b)=>`小明有${a}顆草莓，分給媽媽${b}顆，還剩下幾顆草莓？`,e:"🍓"}
  ];
  // 國字數字：2 念「兩」，11–99 念「十一、二十三」，100 念「一百」
  const cn=n=>{
    if(n===2)return"兩";if(n<=10)return CN[n];if(n===100)return"一百";
    const t=Math.floor(n/10),o=n%10,D="零一二三四五六七八九";
    return(t===1?"":D[t])+"十"+(o?D[o]:"");
  };

  // ---- 注音 ----
  const ZHUYIN={
    零:"ㄌㄧㄥˊ",一:"ㄧ",兩:"ㄌㄧㄤˇ",三:"ㄙㄢ",四:"ㄙˋ",五:"ㄨˇ",六:"ㄌㄧㄡˋ",七:"ㄑㄧ",八:"ㄅㄚ",九:"ㄐㄧㄡˇ",十:"ㄕˊ",二:"ㄦˋ",百:"ㄅㄞˇ",
    農:"ㄋㄨㄥˊ",場:"ㄔㄤˇ",裡:"ㄌㄧˇ",有:"ㄧㄡˇ",隻:"ㄓ",小:"ㄒㄧㄠˇ",雞:"ㄐㄧ",和:"ㄏㄜˊ",鴨:"ㄧㄚ",總:"ㄗㄨㄥˇ",
    共:"ㄍㄨㄥˋ",幾:"ㄐㄧˇ",動:"ㄉㄨㄥˋ",物:"ㄨˋ",樹:"ㄕㄨˋ",上:"ㄕㄤˋ",鳥:"ㄋㄧㄠˇ",又:"ㄧㄡˋ",飛:"ㄈㄟ",來:"ㄌㄞˊ",
    了:"˙ㄌㄜ",現:"ㄒㄧㄢˋ",在:"ㄗㄞˋ",籃:"ㄌㄢˊ",子:"˙ㄗ",顆:"ㄎㄜ",蘋:"ㄆㄧㄥˊ",果:"ㄍㄨㄛˇ",橘:"ㄐㄩˊ",水:"ㄕㄨㄟˇ",
    花:"ㄏㄨㄚ",園:"ㄩㄢˊ",開:"ㄎㄞ",朵:"ㄉㄨㄛˇ",紅:"ㄏㄨㄥˊ",黃:"ㄏㄨㄤˊ",池:"ㄔˊ",塘:"ㄊㄤˊ",青:"ㄑㄧㄥ",蛙:"ㄨㄚ",
    跳:"ㄊㄧㄠˋ",明:"ㄇㄧㄥˊ",枝:"ㄓ",鉛:"ㄑㄧㄢ",筆:"ㄅㄧˇ",媽:"ㄇㄚ",給:"ㄍㄟˇ",他:"ㄊㄚ",盤:"ㄆㄢˊ",塊:"ㄎㄨㄞˋ",
    餅:"ㄅㄧㄥˇ",乾:"ㄍㄢ",蛋:"ㄉㄢˋ",糕:"ㄍㄠ",點:"ㄉㄧㄢˇ",心:"ㄒㄧㄣ",停:"ㄊㄧㄥˊ",車:"ㄔㄜ",輛:"ㄌㄧㄤˋ",汽:"ㄑㄧˋ",
    公:"ㄍㄨㄥ",書:"ㄕㄨ",架:"ㄐㄧㄚˋ",本:"ㄅㄣˇ",故:"ㄍㄨˋ",事:"ㄕˋ",圖:"ㄊㄨˊ",畫:"ㄏㄨㄚˋ",天:"ㄊㄧㄢ",星:"ㄒㄧㄥ",
    出:"ㄔㄨ",魚:"ㄩˊ",缸:"ㄍㄤ",條:"ㄊㄧㄠˊ",美:"ㄇㄟˇ",先:"ㄒㄧㄢ",吃:"ㄔ",草:"ㄘㄠˇ",莓:"ㄇㄟˊ",狗:"ㄍㄡˇ",
    貓:"ㄇㄠ",桌:"ㄓㄨㄛ",個:"ㄍㄜˋ",氣:"ㄑㄧˋ",球:"ㄑㄧㄡˊ",藍:"ㄌㄢˊ",
    走:"ㄗㄡˇ",還:"ㄏㄞˊ",剩:"ㄕㄥˋ",下:"ㄒㄧㄚˋ",掉:"ㄉㄧㄠˋ",破:"ㄆㄛˋ",摘:"ㄓㄞ",送:"ㄙㄨㄥˋ",弟:"ㄉㄧˋ",
    借:"ㄐㄧㄝˋ",跑:"ㄆㄠˇ",根:"ㄍㄣ",骨:"ㄍㄨˇ",頭:"ㄊㄡˊ",分:"ㄈㄣ"
  };
  const ZY_WORDS={"媽媽":["ㄇㄚ","˙ㄇㄚ"],"弟弟":["ㄉㄧˋ","˙ㄉㄧ"],"骨頭":["ㄍㄨˇ","˙ㄊㄡ"]};   // 詞語裡要念輕聲的字
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function zyChar(ch,z){
    if(!z)return esc(ch);
    const light=z[0]==="˙";
    const syms=[...(light?z.slice(1):z)];
    const tone=/[ˊˇˋ]/.test(syms[syms.length-1])?syms.pop():"";
    const col=syms.map((s,k)=>`<span>${s}${k===syms.length-1&&tone?`<span class="t">${tone}</span>`:""}</span>`).join("");
    return `<span class="zy"><span class="h">${ch}</span><span class="b" aria-hidden="true">${light?'<span class="lt">˙</span>':""}${col}</span></span>`;
  }
  function zy(text){
    const chars=[...String(text)],out=[];
    for(let i=0;i<chars.length;){
      const w=Object.keys(ZY_WORDS).find(k=>chars.slice(i,i+[...k].length).join("")===k);
      if(w){[...w].forEach((ch,j)=>out.push(zyChar(ch,ZY_WORDS[w][j])));i+=[...w].length;continue}
      out.push(zyChar(chars[i],ZHUYIN[chars[i]]));i++;
    }
    return out.join("");
  }
  const $=id=>document.getElementById(id);
  const all=sel=>[...document.querySelectorAll(sel)];
  const $round=$("round"),$opts=$("opts"),$optsNote=$("optsNote");
  const band=document.querySelector(".band");
  const wrapEls=all(".band .qwrap"),aEls=all(".band .qa"),bEls=all(".band .qb"),ansEls=all(".band .ans");
  const sentEls=all(".band .sent"),picEls=all(".band .pics"),wansEls=all(".band .wans");
  const sides=all(".side").sort((a,b)=>a.dataset.p-b.dataset.p);

  sides.forEach((el,p)=>{

    const u={el,msg:el.querySelector(".msg"),score:el.querySelector(".score"),scoreB:el.querySelector(".score b"),
      pad:el.querySelector(".pad"),keys:[],ov:el.querySelector(".overlay"),ovH:el.querySelector(".overlay h2"),
      ovP:el.querySelector(".overlay p"),final:el.querySelector(".final"),readyBtn:el.querySelector(".ready"),
      lvtag:el.querySelector(".lvtag"),spk:el.querySelector(".spk"),lvs:[...el.querySelectorAll(".lvs .opt")],

      P[p].lv=+b.dataset.lv;pref("duel-lv"+p,P[p].lv);autoVoice();renderPads();showReadyScreen()}));

    const tap=(node,fn)=>{node.addEventListener("pointerdown",e=>{e.preventDefault();fn()});
      node.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}})};
    u.tap=tap;
    // 「準備好了」用 click（手指放開時觸發），平板才會允許之後的語音
    u.readyBtn.addEventListener("click",()=>toggleReady(p));
  });
  // 按鍵：初級 0–10、進階 0–20 是數字鍵；高級（到 100）改成四個選項，每題換一次（各自依自己的難度）
  function renderPads(){
    ui.forEach((u,p)=>{
      const lv=P[p].lv,choice=lv>=2,n=choice?4:LV[lv].max+1;
      u.pad.className="pad"+(choice?" choices":lv===2?" wide":"");
      u.pad.innerHTML=Array.from({length:n},(_,i)=>`<button type="button" class="key" data-v="${choice?"":i}">${choice?"?":i}</button>`).join("");
      u.keys=[...u.pad.querySelectorAll(".key")];
      u.keys.forEach(k=>u.tap(k,()=>{if(k.dataset.v!=="")answer(p,+k.dataset.v,k)}));
    });
  }
  // 高級：正確答案加三個接近的數字；兩邊同一題時順序也一樣
  function setChoices(){
    let shared=null;
    ui.forEach((u,p)=>{
      if(P[p].lv<2)return;
      if(!(shared&&sameQ())){
        const ans=P[p].q.sum,set=new Set([ans]);
        const sp=P[p].lv===2?4:10,top=LV[P[p].lv].max;
        while(set.size<4){const v=ans+(Math.random()<.5?-1:1)*rnd(1,sp);if(v>=0&&v<=top)set.add(v)}
        shared=[...set].sort(()=>Math.random()-.5);
      }
      u.keys.forEach((k,i)=>{k.dataset.v=shared[i];k.textContent=shared[i]});
    });
  }
  function blankChoices(){ui.forEach((u,p)=>{if(P[p].lv>=2)u.keys.forEach(k=>{k.dataset.v="";k.textContent="?"})})}
  const sameQ=()=>P[0].lv===P[1].lv;

    if(P[0].lv===P[1].lv){P[0].voice=P[1].voice=true}
    else{const low=P[0].lv<P[1].lv?0:1;P[low].voice=true;P[1-low].voice=false}
  }
  function syncSetup(){
    ui.forEach((u,p)=>{
      u.lvs.forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===P[p].lv));
      u.vbtn.textContent=P[p].voice?"🔊":"🔇";u.vbtn.setAttribute("aria-label",P[p].voice?"念題目：開":"念題目：關");u.vbtn.setAttribute("aria-pressed",P[p].voice);
      u.lvtag.textContent=STAR[P[p].lv];u.lvtag.setAttribute("aria-label",LV[P[p].lv].name);u.spk.classList.toggle("off",!P[p].voice);
    });
  }

  // ---- 語音 ----
  const synth=window.speechSynthesis;
  let zhVoice=null,zhVoices=[];
  const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
  S.rate=+(pref("duel-rate")||.9)||.9;
  const voiceKey=v=>v.voiceURI||v.name;
  // iPad 會把同一個聲音依音質各列一次，也會列出趣味聲音：分辨出來
  function voiceQuality(v){
    const u=v.voiceURI||"";
    if(/eloquence|speech\.synthesis\.voice/i.test(u))return 0;   // 趣味聲音
    if(/\.premium\./i.test(u))return 3;                           // 進階版
    if(/enhanced|-premium/i.test(u))return 2;                      // 增強版
    return 1;                                                      // 標準版
  }
  const QUALITY_ZH=["趣味聲音","標準版","增強版","進階版"];
  const accentOf=lang=>/TW|Hant/i.test(lang)?0:/HK|yue/i.test(lang)?1:2;
  const ACCENT_ZH=["台灣","香港","大陸"];
  function pickVoice(){
    if(!synth)return;
    const vs=synth.getVoices().filter(v=>/^(zh|cmn|yue)/i.test(v.lang));
    zhVoices=vs.sort((a,b)=>accentOf(a.lang)-accentOf(b.lang)||voiceQuality(b)-voiceQuality(a)||a.name.localeCompare(b.name));
    // 預設：台灣口音、音質最好、像老師的聲音優先（iPad 美佳、Windows Yating/Hanhan、Chrome Google）
    const usual=v=>/Mei-?Jia|美佳|Yating|Hanhan|Google/i.test(v.name)?1:0;
    const best=zhVoices.filter(v=>accentOf(v.lang)===0&&voiceQuality(v)>0).sort((a,b)=>voiceQuality(b)-voiceQuality(a)||usual(b)-usual(a))[0]
      ||zhVoices.find(v=>voiceQuality(v)>0)||zhVoices[0]||null;
    const want=pref("duel-voice");
    zhVoice=(want&&zhVoices.find(v=>voiceKey(v)===want))||best;
    fillVoiceSel(best,want);
  }
  function fillVoiceSel(best,want){
    const sel=document.getElementById("voiceSel"),note=document.getElementById("voiceNote");
    if(!sel)return;
    const opts=[`<option value="">自動（${best?esc(best.name):"平板預設"}）</option>`]
      .concat(zhVoices.map(v=>`<option value="${esc(voiceKey(v))}">${esc(v.name)}（${ACCENT_ZH[accentOf(v.lang)]}・${QUALITY_ZH[voiceQuality(v)]}）</option>`));
    sel.innerHTML=opts.join("");
    sel.value=(want&&zhVoices.some(v=>voiceKey(v)===want))?want:"";
    note.textContent=zhVoices.length
      ?"想要更自然的聲音：iPad 到「設定 → 輔助使用 → 朗讀內容 → 聲音 → 中文」下載「增強版」或「進階版」，再回來這裡選。"
      :"這台平板目前沒有中文語音，請到平板的語音設定下載中文（台灣）語音。";
  }
  if(synth){pickVoice();try{synth.addEventListener("voiceschanged",pickVoice)}catch(e){}}
  function say(text){
    if(!S.voice||!synth)return;

      u.lang=zhVoice?zhVoice.lang.replace("_","-"):"zh-TW";if(zhVoice)u.voice=zhVoice;
      u.rate=S.rate;u.pitch=1.1;u.volume=1;
      u.onstart=()=>duck(true);u.onend=u.onerror=()=>duck(false);
      // iPad / Safari：cancel 之後立刻 speak 有時會被吞掉，所以稍等一下再念
      if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{try{synth.speak(u)}catch(e){}},90)}

    }catch(e){}
  }
  // 平板只允許在「手指離開螢幕」時解鎖聲音：前幾次碰觸時解鎖語音與音效
  let unlockTries=0;
  function unlockAudio(){
    if(unlockTries>=4)return;unlockTries++;

      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state!=="running")ac.resume();
      const buf=ac.createBuffer(1,1,22050),src=ac.createBufferSource();
      src.buffer=buf;src.connect(ac.destination);src.start(0);
    }catch(e){}
    try{if(synth&&!synth.speaking){const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}}catch(e){}
    if(M.on)musicStart();
  }
  ["touchend","pointerup","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
  const qText=q=>q.text||`${q.a} ${q.word} ${q.b}，等於多少？`;
  // 同一題：念一次；不同題：念有開「念題目」的那幾邊，前面加上顏色
  const readQ=()=>{
    if(!P[0].q)return;
    if(sameQ()){if(P[0].voice||P[1].voice)say(qText(P[0].q));return}
    const who=[0,1].filter(p=>P[p].voice);
    if(who.length)say(who.map(p=>`${COLOR[p]}，${qText(P[p].q)}`).join("。"));
  };

  // ---- 音效 ----
  let ac=null;
  function tone(freqs,dur=.12,type="triangle"){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==="suspended")ac.resume();
      freqs.forEach((f,i)=>{
        const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;
        o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
        o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.7);
      });
    }catch(e){}
  }
  const sfx={good:()=>tone([784,1175],.14,"sine"),bad:()=>tone([150],.3,"square"),tick:()=>tone([520],.1),go:()=>tone([880],.25),win:()=>tone([523,659,784,1047],.16)};
  {const _g=sfx.good;sfx.good=(...a)=>{try{window.parkBurst&&parkBurst()}catch(err){}return _g(...a)}}
  async function wake(){try{await navigator.wakeLock?.request("screen")}catch(e){}}

  // ---- 背景音樂盒：WebAudio 即時產生的原創 8 小節小曲，固定循環、每個音一樣大聲，不需要音樂檔 ----
  const M={on:pref("duel-music")!=="off",vol:pref("duel-music-vol")||"m",gain:null,bus:null,timer:null,next:0,step:0};
  const MVOL={s:.07,m:.12,l:.19};
  // 每小節的和弦（分解和弦用）與兩個旋律音（第 1、3 拍）
  const BARS=[
    {ch:[72,76,79],mel:[88,84]},   // C
    {ch:[69,72,76],mel:[84,81]},   // Am
    {ch:[65,69,72],mel:[81,84]},   // F
    {ch:[67,71,74],mel:[83,79]},   // G
    {ch:[72,76,79],mel:[88,91]},   // C
    {ch:[69,72,76],mel:[88,84]},   // Am
    {ch:[65,69,72],mel:[86,81]},   // F
    {ch:[67,71,74],mel:[86,83]}    // G
  ];
  const ARP=[0,2,1,2,0,2,1,2];      // 分解和弦的順序：根、五、三、五……
  const STEP=60/70/2;               // 每分鐘 70 拍的八分音符（慢一點）
  const hz=m=>440*Math.pow(2,(m-69)/12);
  // 音樂盒的「叮」：基音 + 一個高泛音，瞬間起音、慢慢消失
  function bell(m,t,vel,len){
    const f=hz(m);
    [[f,vel,len],[f*4.2,vel*.18,len*.35]].forEach(([fr,v,d])=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type="sine";o.frequency.value=fr;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(M.bus);o.start(t);o.stop(t+d+.05);
    });
  }
  function mSchedule(){
    if(!ac||ac.state!=="running")return;
    if(M.next<ac.currentTime)M.next=ac.currentTime+.05;
    while(M.next<ac.currentTime+.3){
      const t=M.next,s=M.step%8,bar=BARS[Math.floor(M.step/8)%BARS.length];
      bell(bar.ch[ARP[s]],t,.16,1.4);
      if(s===0)bell(bar.mel[0],t,.26,2.2);
      if(s===4)bell(bar.mel[1],t,.26,2.2);
      M.next+=STEP;M.step++;
    }
  }
  function musicStart(){
    if(!M.on||M.timer)return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state!=="running")ac.resume();
      if(!M.gain){
        M.gain=ac.createGain();M.gain.connect(ac.destination);
        // 壓縮器把音量拉平，避免忽大忽小
        M.bus=ac.createDynamicsCompressor();
        M.bus.threshold.value=-26;M.bus.knee.value=12;M.bus.ratio.value=4;M.bus.attack.value=.003;M.bus.release.value=.25;

      }

      M.gain.gain.setValueAtTime(0,ac.currentTime);M.gain.gain.linearRampToValueAtTime(MVOL[M.vol],ac.currentTime+1.5);

    }catch(e){}
  }
  function musicStop(){
    clearInterval(M.timer);M.timer=null;
    try{if(M.gain){M.gain.gain.cancelScheduledValues(ac.currentTime);M.gain.gain.setTargetAtTime(0,ac.currentTime,.2)}}catch(e){}
  }
  // 念題目時音樂轉小聲
  // 念題目時音樂稍微轉小，慢慢降、慢慢回來，聽起來比較順
  let duckTimer=null;
  function duck(on){
    clearTimeout(duckTimer);
    const apply=()=>{try{if(M.gain&&M.timer)M.gain.gain.setTargetAtTime(MVOL[M.vol]*(on?.55:1),ac.currentTime,.45)}catch(e){}};
    if(on)apply();else duckTimer=setTimeout(apply,400);   // 念完稍等一下再回來，避免題目之間一大一小
  }
  document.addEventListener("visibilitychange",()=>{if(document.hidden)musicStop();else if(M.on&&ac)musicStart()});

  // ---- 題目顯示（正反兩行同步） ----
  const pop=()=>wrapEls.forEach(e=>{e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")});
  const qopEls=all(".band .qop");
  function showQ(a,b,ans,sym="+"){
    band.classList.remove("word");
    qopEls.forEach(e=>e.textContent=sym);
    aEls.forEach(e=>e.textContent=a);bEls.forEach(e=>e.textContent=b);ansEls.forEach(e=>{e.textContent=ans;e.classList.remove("ok")});
    pop();
  }
  // 中間兩行：上面那行（倒過來）給玩家 2，下面那行給玩家 1
  const LINE=[1,0];
  function showBoth(){
    const word=S.mode==="word";band.classList.toggle("word",word);
    [0,1].forEach(p=>{
      const q=P[p].q,i=LINE[p];
      if(word){sentEls[i].innerHTML=zy(q.text);sentEls[i].setAttribute("aria-label",q.text);picEls[i].innerHTML=q.pics;
        wansEls[i].textContent="答案：？";wansEls[i].classList.remove("ok")}
      else{qopEls[i].textContent=q.sym;aEls[i].textContent=q.a;bEls[i].textContent=q.b;ansEls[i].textContent="?";ansEls[i].classList.remove("ok")}
    });
    pop();
  }
  function reveal(p){
    const q=P[p].q,i=LINE[p];
    ansEls[i].textContent=q.sum;ansEls[i].classList.add("ok");

  }
  const revealAll=()=>{reveal(0);reveal(1)};

  // ---- 遊戲流程 ----
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  function newQuestion(lv){
    const ops=[S.ops.add&&"+",S.ops.sub&&"-"].filter(Boolean);
    let a,b,op,k,t=0;
    do{
      op=ops[rnd(0,ops.length-1)];
      const N=LV[lv].max;
      if(op==="+"){a=rnd(1,N-1);b=rnd(1,N-a)}   // 和不超過難度上限
      else{a=rnd(2,N);b=rnd(1,a-1)}             // 上限以內，答案至少 1
      k=a+op+b;
    }while(k===S.last[lv]&&++t<20);
    const add=op==="+";
    S.last[lv]=k;const q={a,b,op,sum:add?a+b:a-b,sym:add?"+":"−",word:add?"加":"減"};
    if(S.mode==="word"){
      const list=add?TPL:TPL_SUB;
      let ti;do{ti=rnd(0,list.length-1)}while(op+ti===S.lastT&&list.length>1);
      S.lastT=op+ti;const tp=list[ti];
      q.text=tp.t(cn(a),cn(b));
      // 數字大於 10 時圖案太多，就不畫圖案
      q.pics=(add?a+b:a)>10?""
        :add?tp.ea.repeat(a)+" ＋ "+tp.eb.repeat(b)
        :Array.from({length:a},(_,i)=>i<a-b?`<span>${tp.e}</span>`:`<span class="gone">${tp.e}</span>`).join("");
    }
    return q;
  }
  function setMsg(p,t,cls=""){ui[p].msg.textContent=t;ui[p].msg.className="msg "+cls}
  function updateRound(){$round.textContent=S.phase==="ready"?`共 ${S.total} 題`:`${Math.min(S.round,S.total)} / ${S.total}`}
  function updateScore(p,bump){ui[p].scoreB.textContent=S.score[p];
    if(bump){ui[p].score.classList.remove("bump");void ui[p].score.offsetWidth;ui[p].score.classList.add("bump")}}
  function syncOpts(){
    const lock=S.phase!=="ready";
    all(".drawer .lockable button, .drawer .lockable input").forEach(b=>b.disabled=lock);
    $optsNote.hidden=!lock;
  }

  let timer=null;
  function showReadyScreen(){
    clearTimeout(timer);try{synth&&synth.cancel()}catch(e){}
    S.phase="ready";S.ready=[false,false];S.round=0;S.score=[0,0];P[0].q=P[1].q=null;
    ui.forEach((u,p)=>{
      updateScore(p);u.ov.hidden=false;u.ovH.textContent=NAMES[p];u.ovP.hidden=false;u.final.hidden=true;
      u.lvRow.hidden=false;u.vRow.hidden=false;
      const opName=S.ops.add&&S.ops.sub?"加減混合":S.ops.sub?"減法":"加法";
      u.ovP.textContent=`${opName}・${S.mode==="word"?"應用題":"數字題"}・共 ${S.total} 題。${sameQ()?"兩邊搶答同一題，先按對的人得分。":"難度不同，各答自己的題目，先答對的人得分。"}`;
      u.readyBtn.textContent="READY";u.readyBtn.classList.remove("on");
      setMsg(p,"");u.el.classList.remove("locked");u.keys.forEach(k=>k.classList.remove("wrong","right"));
    });
    showQ("?","?","?");updateRound();syncOpts();blankChoices();syncSetup();
  }
  function toggleReady(p){
    hideTour();
    if(S.phase==="over"){showReadyScreen();return}
    if(S.phase!=="ready")return;
    S.ready[p]=!S.ready[p];
    const b=ui[p].readyBtn;b.classList.toggle("on",S.ready[p]);b.textContent=S.ready[p]?"✅":"READY";
    sfx.tick();

  }
  function countdown(){
    S.phase="countdown";syncOpts();closeMenu();wake();
    ui.forEach((u,p)=>{u.ov.hidden=true;setMsg(p,"準備…")});
    say("準備，開始囉");
    let n=3;
    const step=()=>{
      if(S.phase!=="countdown")return;
      if(n>0){showQ("",n,"");ansEls.forEach(e=>e.textContent="");sfx.tick();n--;timer=setTimeout(step,800)}

  function nextRound(){

  function answer(p,v,keyEl){
    if(S.phase!=="play"||S.locked[p])return;

    if(v===q.sum){

      S.locked[p]=true;sfx.bad();keyEl.classList.add("wrong");ui[p].el.classList.add("locked");

      if(S.locked[0]&&S.locked[1]){

        ui.forEach((u,i)=>setMsg(i,`都答錯了，答案是 ${P[i].q.sum}`,"bad"));
        say(sameQ()?`都答錯了，${eq(q)}`:`都答錯了。藍色，${eq(P[0].q)}。橘色，${eq(P[1].q)}`);
        timer=setTimeout(nextRound,3000);

    }
  }
  function finish(){
    S.phase="over";sfx.win();updateRound();syncOpts();
    const [a,b]=S.score;
    ui.forEach((u,p)=>{
      const me=S.score[p],op=S.score[1-p];
      u.ov.hidden=false;
      u.ovH.textContent=me>op?"你贏了！🏆":me<op?"再接再厲！":"平手！";
      u.ovP.hidden=true;u.lvRow.hidden=true;u.vRow.hidden=true;
      const card=(who,k,n,win)=>`<div class="card k${k}${win?" win":""}"><span class="who">${who}</span><span class="pts">${n}<small>分</small></span></div>`;
      u.final.innerHTML=card("你",p+1,me,me>op)+card("對手",2-p,op,op>me);
      u.final.hidden=false;
      u.readyBtn.classList.remove("on");u.readyBtn.textContent="🔁";
    });
    if(a!==b)try{window.parkWin&&parkWin(ui[a>b?0:1].ov)}catch(e){}

  }

  // ---- 左側選單 ----
  const drawer=$("drawer"),scrim=$("scrim"),menuBtn=$("menuBtn");
  function openMenu(){drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");scrim.hidden=false;menuBtn.setAttribute("aria-expanded","true");$("closeMenu").focus()}
  function closeMenu(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");scrim.hidden=true;menuBtn.setAttribute("aria-expanded","false")}
  menuBtn.addEventListener("click",()=>{hideTour();drawer.classList.contains("open")?closeMenu():openMenu()});
  // 新手導覽：每次開啟都提示選單位置，除非勾了「不要再顯示」
  const tour=$("tour"),tourOff=$("tourOff"),tourShow=$("tourShow");
  function hideTour(){
    if(tour.hidden)return;
    tour.hidden=true;menuBtn.classList.remove("pulse");
    if(tourOff.checked){pref("duel-tour","off");tourShow.checked=false}
  }
  $("tourOk").addEventListener("click",hideTour);
  tourShow.checked=pref("duel-tour")!=="off";
  tourShow.addEventListener("change",()=>{pref("duel-tour",tourShow.checked?"on":"off");tourOff.checked=!tourShow.checked});
  if(tourShow.checked){tour.hidden=false;menuBtn.classList.add("pulse")}
  $("closeMenu").addEventListener("click",closeMenu);
  scrim.addEventListener("click",closeMenu);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});

  $opts.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{
    if(S.phase!=="ready")return;
    S.total=+btn.dataset.n;
    $opts.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
    showReadyScreen();
  }));
  all("#modes button").forEach(btn=>btn.addEventListener("click",()=>{
    if(S.phase!=="ready")return;
    S.mode=btn.dataset.mode;
    document.body.classList.toggle("word-mode",S.mode==="word");
    all("#modes button").forEach(b=>b.setAttribute("aria-pressed",b===btn));
    showReadyScreen();
  }));
  $("pics").addEventListener("click",e=>{
    S.pics=!S.pics;band.classList.toggle("nopics",!S.pics);
    e.currentTarget.setAttribute("aria-pressed",S.pics);
    e.currentTarget.textContent=S.pics?"應用題圖案提示：開":"應用題圖案提示：關";
  });
  $("say").addEventListener("click",()=>{if(P[0].q&&S.phase!=="ready")readQ();else say("加減法搶答對決")});
  // 背景音樂設定
  const $music=$("music"),$musicVol=$("musicVol");
  const syncMusicBtn=()=>{$music.setAttribute("aria-pressed",M.on);$music.textContent=M.on?"輕音樂：開":"輕音樂：關"};
  syncMusicBtn();$musicVol.value=MVOL[M.vol]?M.vol:"m";M.vol=$musicVol.value;
  $music.addEventListener("click",()=>{
    M.on=!M.on;pref("duel-music",M.on?"on":"off");syncMusicBtn();
    if(M.on)musicStart();else musicStop();
  });
  $musicVol.addEventListener("change",e=>{
    M.vol=e.target.value;pref("duel-music-vol",M.vol);
    try{if(M.gain&&M.timer)M.gain.gain.setTargetAtTime(MVOL[M.vol],ac.currentTime,.1)}catch(err){}
  });
  // 運算勾選：至少留一個
  try{const o=JSON.parse(pref("duel-ops")||"null");if(o&&(o.add||o.sub))S.ops={add:!!o.add,sub:!!o.sub}}catch(e){}
  $("opAdd").checked=S.ops.add;$("opSub").checked=S.ops.sub;
  const opNote=$("opNote");
  [["opAdd","add"],["opSub","sub"]].forEach(([id,key])=>$(id).addEventListener("change",e=>{
    if(S.phase!=="ready"){e.target.checked=S.ops[key];return}
    const next={...S.ops,[key]:e.target.checked};
    if(!next.add&&!next.sub){e.target.checked=true;opNote.textContent="至少要勾選一種運算。";return}
    S.ops=next;pref("duel-ops",JSON.stringify(S.ops));
    opNote.textContent=S.ops.add&&S.ops.sub?"目前：加減混合出題。":S.ops.sub?"目前：只出減法。":"目前：只出加法。";
    showReadyScreen();
  }));
  $("voice").addEventListener("click",e=>{
    S.voice=!S.voice;e.currentTarget.setAttribute("aria-pressed",S.voice);
    e.currentTarget.textContent=S.voice?"語音朗讀：開":"語音朗讀：關";
    if(!S.voice){try{synth&&synth.cancel()}catch(err){}}
  });
  $("restart").addEventListener("click",()=>{showReadyScreen();closeMenu()});
  $("voiceSel").addEventListener("change",e=>{
    const k=e.target.value;pref("duel-voice",k);
    pickVoice();say("三 加 四 等於 七");
  });
  $("rateSel").value=String(S.rate);
  if(!$("rateSel").value)$("rateSel").value="0.9";
  $("rateSel").addEventListener("change",e=>{S.rate=+e.target.value;pref("duel-rate",e.target.value);say("三 加 四 等於 七")});
  $("tryVoice").addEventListener("click",()=>say("農場裡有三隻小雞和兩隻小鴨，總共有幾隻動物？"));
  pickVoice();
  if(!synth)$("voiceGroup").hidden=true;

  // 難度：兩邊各自記住；第一次玩時沿用遊樂園共用的難度
  const base=LV[+pref("park-level")]?+pref("park-level"):1;
  P.forEach((x,p)=>{const v=+pref("duel-lv"+p);x.lv=LV[v]?v:base});
  autoVoice();renderPads();
  showReadyScreen();
})();
</script>
</body></html>
