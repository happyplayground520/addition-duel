<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>套圈圈九九快答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* 單人計時遊戲：上方出乘法題，攤位上擺著寫數字的獎品瓶，點答案那一瓶，圈圈就飛過去套住 */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#1f2b33; --muted:#5d6b72; --good:#1f9d61; --bad:#d23c3c;
  --accent:#1fb5a8; --accent-dark:#13786f; --wood:#c98a52; --wood-dark:#9b6236;
  --num:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{background:linear-gradient(#ffe3ef,#fff3f8 58%,#ffd9a8 58%);color:var(--ink);font-family:var(--text);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;flex-direction:column}
[hidden]{display:none!important}
.top{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.ibtn{width:48px;height:48px;border-radius:14px;border:0;background:#fff;font-size:24px;cursor:pointer;
  display:grid;place-items:center;text-decoration:none;color:inherit;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.q{justify-self:center;background:#fff;border-radius:20px;padding:.05em .6em;font-family:var(--num);font-weight:800;
  font-size:clamp(40px,8.5vmin,86px);line-height:1.15;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.q .ans{color:var(--accent)}
.q.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.15)}}
.stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:var(--num);font-weight:800;color:var(--ink)}
.stats .sc{font-size:clamp(20px,3.6vmin,32px)}
.stats .best{font-family:var(--text);font-size:13px;opacity:.85}
.timebar{height:14px;margin:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:#fff;border-radius:999px;overflow:hidden;position:relative}
.timebar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#1fb5a8,#f2c12e);border-radius:999px}
.timebar.low i{background:var(--bad)}
.timeTxt{text-align:center;font-family:var(--num);font-weight:800;font-size:clamp(16px,2.6vmin,22px);color:var(--muted);margin-top:2px}
/* 三角彩旗 */
.bunting{position:absolute;left:0;right:0;top:0;height:26px;pointer-events:none;
  background:conic-gradient(from 150deg at 50% 0,#ff8fb8 0 60deg,transparent 0) 0 0/40px 26px repeat-x,
             conic-gradient(from 150deg at 50% 0,#8fd3ff 0 60deg,transparent 0) 20px 0/40px 26px repeat-x;opacity:.9}
/* 攤位：燈泡招牌＋三層木架上的瓶子 */
.booth{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.shelves{display:grid;grid-template-rows:repeat(2,auto);gap:clamp(10px,2.4vmin,24px);width:min(900px,100%)}
.shelf{display:flex;justify-content:space-around;align-items:flex-end;padding:0 10px;border-bottom:14px solid #f7b7cf;
  border-radius:0 0 10px 10px;box-shadow:0 6px 0 #e58fb0}
.bottle{position:relative;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;width:clamp(70px,13vmin,130px);
  display:flex;flex-direction:column;align-items:center}
.bottle .neck{position:relative;width:34%;height:clamp(16px,3.6vmin,32px);background:var(--c);border-radius:10px 10px 4px 4px;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.bottle .neck::before{content:"";position:absolute;left:-12%;right:-12%;top:-7px;height:10px;border-radius:6px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.bottle .body{position:relative;width:100%;aspect-ratio:1/1.1;background:var(--c);border-radius:46% 46% 40% 40%/42% 42% 50% 50%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10%;
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.08),inset 8px 8px 0 rgba(255,255,255,.45)}
.bottle .face{position:absolute;top:16%;left:0;right:0;height:26%}
.bottle .face i{position:absolute;top:0;width:9%;aspect-ratio:1/1.25;border-radius:50%;background:#3a2e39}
.bottle .face i:nth-child(1){left:28%} .bottle .face i:nth-child(2){right:28%}
.bottle .face b{position:absolute;top:34%;width:13%;aspect-ratio:1.6/1;border-radius:50%;background:#ff8fab;opacity:.75}
.bottle .face b:nth-child(3){left:14%} .bottle .face b:nth-child(4){right:14%}
.bottle .face u{position:absolute;left:50%;top:30%;width:14%;aspect-ratio:2/1;transform:translateX(-50%);
  border:3px solid #3a2e39;border-top:0;border-radius:0 0 999px 999px;text-decoration:none}
.bottle .label{background:#fff;border-radius:999px;padding:0 .3em;min-width:62%;font-family:var(--num);font-weight:800;
  font-size:clamp(24px,5vmin,50px);line-height:1.15;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.bottle.hit .body{animation:hop .45s}
@keyframes hop{40%{transform:translateY(-14px) scale(1.05)}}
.bottle.hit .face u{width:22%;border-radius:0 0 999px 999px;background:#3a2e39;border:0;aspect-ratio:2/1.1}
.bottle.hit .face i{aspect-ratio:1/.6;border-radius:50% 50% 0 0}
.bottle.wrong .face u{border-radius:999px 999px 0 0;border-top:3px solid #3a2e39;border-bottom:0;top:42%}
.bottle:active .body{transform:translateY(2px)}
.bottle.wrong .body{animation:shake .35s}
.bottle.hit .label{background:var(--good);color:#fff}
@keyframes shake{25%{translate:-6px 0}75%{translate:6px 0}}
/* 飛出去的圈圈 */
.ring{position:fixed;width:clamp(60px,11vmin,110px);aspect-ratio:2.2/1;border-radius:50%;pointer-events:none;z-index:10;
  --t:clamp(8px,1.5vmin,14px);
  background:conic-gradient(#ff7aa8,#ffb86b,#ffe66b,#7ee08a,#6bc7ff,#b48cff,#ff7aa8);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--t)),#000 calc(100% - var(--t) + 1px));
  mask:radial-gradient(farthest-side,transparent calc(100% - var(--t)),#000 calc(100% - var(--t) + 1px));
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.float{position:fixed;font-family:var(--num);font-weight:800;font-size:28px;pointer-events:none;animation:up .8s forwards;z-index:11}
.float.plus{color:var(--good)} .float.minus{color:var(--bad)}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.count{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:clamp(90px,24vmin,200px);
  color:var(--accent);pointer-events:none;z-index:15;text-shadow:0 6px 0 rgba(0,0,0,.25)}
/* 開始／結束畫面 */
.cover{position:fixed;inset:0;z-index:20;display:grid;place-items:start center;overflow-y:auto;background:rgba(255,227,239,.88);
  padding:max(12px,env(safe-area-inset-top,0px)) 16px max(12px,env(safe-area-inset-bottom,0px))}
.box{margin:auto 0;background:#fff;border-radius:24px;padding:clamp(18px,4vmin,32px);width:min(520px,100%);box-shadow:0 12px 40px rgba(0,0,0,.3);
  display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.box h2{margin:0;font-size:clamp(24px,4.6vmin,38px);text-wrap:balance}
.box p{margin:0;color:var(--muted);font-size:clamp(15px,2.5vmin,19px);line-height:1.5}
#start .box>.big{position:sticky;bottom:0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lbl{font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}
.opt{font:inherit;font-size:17px;font-weight:700;border:2px solid #cfd8dc;background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer;color:inherit}
.opt small{display:block;font-size:12px;font-weight:600;opacity:.75}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.big{font-family:var(--text);font-weight:800;font-size:clamp(20px,4vmin,30px);border:0;border-radius:999px;padding:.45em 1.6em;
  background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--accent-dark);text-decoration:none;display:inline-block}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-dark)}
.big.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #cfd8dc;border:2px solid #cfd8dc}
.result{font-family:var(--num);font-weight:800;font-size:clamp(56px,13vmin,110px);line-height:1;color:var(--accent)}
.result small{font-family:var(--text);font-size:.3em;color:var(--muted)}
.newrec{font-weight:800;color:#fff;background:var(--good);border-radius:999px;padding:4px 16px;font-size:18px}
.note{font-size:13px;color:var(--muted)}
@media (max-height:560px){.box{gap:8px;padding:14px 18px}.box h2{font-size:24px}#start .box>p{display:none}}

/* 手機直放：上方分兩排，第一排 🏠、分數、🔊，第二排整排給題目 */
@media (max-width:600px){
  .top{grid-template-columns:auto 1fr auto auto;grid-template-areas:"home . stats again" "mid mid mid mid";row-gap:6px}
  .top>a.ibtn{grid-area:home} .top>.stats{grid-area:stats} .top>#again{grid-area:again} .top>.q{grid-area:mid;justify-self:center}
}
</style>

</head>
<body data-park>
<header class="top">
  <a class="ibtn" href="park.html" aria-label="回遊樂園地圖">🏠</a>
  <div class="q" id="q" data-zy><svg class="ringico" viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><rect x="27" y="10" width="10" height="20" rx="3" fill="#b9ece4"/><rect x="25.5" y="7" width="13" height="6" rx="2" fill="#7fd6c8"/><rect x="17" y="27" width="30" height="31" rx="10" fill="#b9ece4"/><circle cx="26" cy="42" r="2.2" fill="#1f2b33"/><circle cx="38" cy="42" r="2.2" fill="#1f2b33"/><path d="M28.5 47q3.5 3 7 0" stroke="#1f2b33" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="22" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><circle cx="42" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ff6b9a" stroke-width="5" transform="rotate(-10 32 24)"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ffd23f" stroke-width="5" stroke-dasharray="9 9" transform="rotate(-10 32 24)"/></svg> 套圈圈</div>
  <div class="stats"><span class="sc" id="score">⭐ 0</span><span class="best" id="bestTop"></span></div>
  <button type="button" class="ibtn" id="again" aria-label="再念一次題目">🔊</button>
</header>
<div class="timebar" id="timebar"><i id="timefill"></i></div>
<div class="timeTxt" id="timeTxt"></div>
<main class="booth">
  <div class="bunting" aria-hidden="true"></div>
  <div class="shelves" id="shelves"></div>
</main>
<div class="count" id="count" hidden></div>

<section class="cover" id="start">
  <div class="box">
    <h2><svg class="ringico" viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true" style="vertical-align:-.12em"><rect x="27" y="10" width="10" height="20" rx="3" fill="#b9ece4"/><rect x="25.5" y="7" width="13" height="6" rx="2" fill="#7fd6c8"/><rect x="17" y="27" width="30" height="31" rx="10" fill="#b9ece4"/><circle cx="26" cy="42" r="2.2" fill="#1f2b33"/><circle cx="38" cy="42" r="2.2" fill="#1f2b33"/><path d="M28.5 47q3.5 3 7 0" stroke="#1f2b33" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="22" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><circle cx="42" cy="46" r="2.6" fill="#ffb3c7" opacity=".8"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ff6b9a" stroke-width="5" transform="rotate(-10 32 24)"/><ellipse cx="32" cy="24" rx="17" ry="6" fill="none" stroke="#ffd23f" stroke-width="5" stroke-dasharray="9 9" transform="rotate(-10 32 24)"/></svg> 套圈圈九九快答</h2>
    <p>看上面的乘法題，把圈圈丟到寫著答案的瓶子上！<br>時間內套中越多個越厲害。</p>
    <span class="lbl">難度</span>
    <div class="row" id="levels">
      <button type="button" class="opt" data-lv="1" aria-label="初級"><span class="lvst">⭐</span><small>2、5 的乘法</small></button>
      <button type="button" class="opt" data-lv="2" aria-label="進階"><span class="lvst">⭐⭐</span><small>2、5、4、8 的乘法</small></button>
      <button type="button" class="opt" data-lv="3" aria-label="高級"><span class="lvst">⭐⭐⭐</span><small>九九乘法</small></button>
    </div>
    <span class="lbl">時間</span>
    <div class="row" id="times">
      <button type="button" class="opt" data-t="30">30 秒</button>
      <button type="button" class="opt" data-t="60">60 秒</button>
      <button type="button" class="opt" data-t="90">90 秒</button>
    </div>
    <span class="note" id="bestStart"></span>
    <button type="button" class="big" id="go" aria-label="開始丟圈圈">READY</button>
  </div>
</section>
<section class="cover" id="end" hidden>
  <div class="box">
    <h2>⏰ 時間到！</h2>
    <div class="result" id="result">0<small> 個</small></div>
    <span class="newrec" id="newrec" hidden>🏆 新紀錄！</span>
    <p id="endText"></p>
    <div class="row">
      <button type="button" class="big ico-btn" id="replay" aria-label="再玩一次">🔁</button>
      <button type="button" class="big alt" id="change">換設定</button>
      <a class="big alt ico-btn" href="park.html" aria-label="回遊樂園">🏠</a>
    </div>
  </div>
</section>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const LV={1:{ks:[2,5],name:"初級"},2:{ks:[2,5,4,8],name:"進階"},3:{ks:[2,3,4,5,6,7,8,9],name:"高級"}};
  const S={lv:LV[+pref("park-level")]?+pref("park-level"):1,time:[30,60,90].includes(+pref("ring-time"))?+pref("ring-time"):60,
    phase:"start",k:0,n:0,score:0,miss:0,endAt:0,lastSec:-1,last:""};
  const bestKey=()=>`ring-best-${S.lv}-${S.time}`,getBest=()=>+pref(bestKey())||0;
  function syncSetup(){
    document.querySelectorAll("#levels button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===S.lv));
    document.querySelectorAll("#times button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.t===S.time));
    const best=getBest(),label=`${LV[S.lv].name}・${S.time} 秒`;
    $("bestStart").textContent=best?`🏆 最佳成績（${label}）：${best} 個`:`（${label}）還沒有紀錄，來挑戰吧！`;
    $("bestTop").textContent=`最佳 ${best}`;
  }
  document.querySelectorAll("#levels button").forEach(b=>b.addEventListener("click",()=>{S.lv=+b.dataset.lv;pref("park-level",S.lv);syncSetup()}));
  document.querySelectorAll("#times button").forEach(b=>b.addEventListener("click",()=>{S.time=+b.dataset.t;pref("ring-time",S.time);syncSetup()}));
  syncSetup();

  // ---- 語音與音效 ----
  const synth=window.speechSynthesis;let voice=null;const rate=+(pref("duel-rate")||.9)||.9;
  const quality=v=>{const u=v.voiceURI||"";return /eloquence|speech\.synthesis\.voice/i.test(u)?0:/\.premium\./i.test(u)?3:/enhanced|-premium/i.test(u)?2:1};
  function pickVoice(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang));const want=pref("duel-voice");
    const tw=vs.filter(v=>/TW|Hant/i.test(v.lang)&&quality(v)>0).sort((a,b)=>quality(b)-quality(a));
    voice=(want&&vs.find(v=>(v.voiceURI||v.name)===want))||tw[0]||vs.find(v=>quality(v)>0)||vs[0]||null}
  if(synth){pickVoice();try{synth.addEventListener("voiceschanged",pickVoice)}catch(e){}}
  function say(t){if(!synth)return;try{const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang.replace("_","-"):"zh-TW";if(voice)u.voice=voice;u.rate=Math.max(rate,1);u.pitch=1.1;
    if(synth.speaking||synth.pending){synth.cancel();setTimeout(()=>{try{synth.speak(u)}catch(e){}},90)}else synth.speak(u)}catch(e){}}
  let ac=null;
  function tone(fs,dur=.12,type="triangle",vol=.15){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();
    fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur*1.7)})}catch(e){}}
  const sfx={good:()=>tone([784,1175],.12,"sine",.3),bad:()=>tone([150],.3,"square",.16),toss:()=>tone([500,700],.06,"sine",.06),
    tick:()=>tone([600],.08),go:()=>tone([900],.25),end:()=>tone([784,659,523,784,1047],.14)};
  {const ag=document.getElementById("again");ag&&ag.addEventListener("click",()=>{if(S.k&&S.n)say(`${S.k}乘以${S.n}`)})}
  {const _g=sfx.good;sfx.good=(...a)=>{try{window.parkBurst&&parkBurst()}catch(err){}return _g(...a)}}
  function unlock(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}
    try{if(synth&&!synth.speaking){const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}}catch(e){}}

  // ---- 出題與瓶子 ----
  const COLORS=["#ffb3c8","#ffd59e","#b8ecc4","#a9dcff","#d6c2ff","#9fe6df","#ffe59a","#ffc4e6"];
  function newQ(){
    const ks=LV[S.lv].ks;let k,n,key,t=0;
    do{k=ks[rnd(0,ks.length-1)];n=rnd(1,9);key=k+"x"+n}while(key===S.last&&++t<10);
    S.last=key;S.k=k;S.n=n;
  }
  // 六個瓶子：答案＋常見的算錯（多一份、少一份、隔壁的乘法、加法）
  function values(){
    const ans=S.k*S.n,set=new Set([ans]);
    [S.k*(S.n+1),S.k*(S.n-1),(S.k+1)*S.n,(S.k-1)*S.n,S.k+S.n,S.k*(S.n+2),ans+1,ans-1].sort(()=>Math.random()-.5)
      .forEach(v=>{if(set.size<6&&v>0)set.add(v)});
    while(set.size<6){const v=ans+rnd(-6,6);if(v>0)set.add(v)}   // 補的數字也靠近答案
    return[...set].sort(()=>Math.random()-.5);
  }
  function setQ(){
    newQ();
    const q=$("q");q.innerHTML=`${S.k} × ${S.n} = <span class="ans">?</span>`;q.classList.remove("bump");void q.offsetWidth;q.classList.add("bump");
    const v=values();
    $("shelves").innerHTML=[v.slice(0,3),v.slice(3)].map(row=>`<div class="shelf">${row.map(x=>
      `<button type="button" class="bottle" data-v="${x}" style="--c:${COLORS[rnd(0,COLORS.length-1)]}" aria-label="${x}"><span class="neck"></span><span class="body"><span class="face" aria-hidden="true"><i></i><i></i><b></b><b></b><u></u></span><span class="label">${x}</span></span></button>`).join("")}</div>`).join("");
    $("shelves").querySelectorAll(".bottle").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();toss(b)}));
    say(`${S.k}乘以${S.n}`);
  }
  // 圈圈從畫面下方飛到瓶頸
  function toss(b){
    if(S.phase!=="play")return;
    sfx.toss();
    const r=b.querySelector(".neck").getBoundingClientRect(),ring=document.createElement("span");ring.className="ring";document.body.appendChild(ring);
    const w=ring.offsetWidth,h=ring.offsetHeight,sx=innerWidth/2-w/2,sy=innerHeight-h-10,ex=r.left+r.width/2-w/2,ey=r.top+r.height*.6-h/2;
    const right=+b.dataset.v===S.k*S.n;
    const anim=ring.animate([
      {transform:`translate(${sx}px,${sy}px) rotateX(60deg) rotate(0deg) scale(1.2)`},
      {transform:`translate(${(sx+ex)/2}px,${Math.min(sy,ey)-80}px) rotateX(65deg) rotate(400deg) scale(1)`,offset:.55},
      {transform:`translate(${ex}px,${ey}px) rotateX(70deg) rotate(720deg) scale(.9)`}
    ],{duration:380,easing:"ease-out",fill:"forwards"});
    S.phase="toss";
    // 用計時器判斷結果，不依賴動畫事件（畫面在背景時動畫可能不會跑完）
    setTimeout(()=>{
      if(right){
        S.score++;sfx.good();b.classList.add("hit");$("score").textContent=`⭐ ${S.score}`;floatTxt(r,"+1","plus");
        $("q").querySelector(".ans").textContent=S.k*S.n;
        // 圈圈在瓶口晃一晃，再滑下去套住
        try{ring.animate([{transform:`translate(${ex}px,${ey}px) rotateX(70deg) rotate(720deg) scale(.9)`},{transform:`translate(${ex-6}px,${ey+6}px) rotateX(70deg) rotate(728deg) scale(.9)`,offset:.3},
          {transform:`translate(${ex+5}px,${ey+12}px) rotateX(70deg) rotate(714deg) scale(.9)`,offset:.6},{transform:`translate(${ex}px,${ey+r.height*.9}px) rotateX(70deg) rotate(720deg) scale(.95)`}],{duration:400,easing:"ease-in",fill:"forwards"})}catch(e){}
        setTimeout(()=>{ring.remove();if(S.phase==="toss"){S.phase="play";setQ()}},420);
      }else{
        S.miss++;sfx.bad();b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");S.endAt-=2000;floatTxt(r,"−2 秒","minus");
        ring.animate([{transform:`translate(${ex}px,${ey}px) rotateX(70deg)`},{transform:`translate(${ex+40}px,${innerHeight}px) rotateX(70deg) rotate(90deg)`,opacity:0}],{duration:450,fill:"forwards"});
        setTimeout(()=>ring.remove(),480);
        if(S.phase==="toss")S.phase="play";
      }
    },400);
  }
  function floatTxt(r,txt,cls){const f=document.createElement("span");f.className="float "+cls;f.textContent=txt;
    f.style.left=r.left-10+"px";f.style.top=r.top-30+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),800)}

  // ---- 計時 ----
  let raf=0;
  function tick(now){
    if(S.phase!=="play"&&S.phase!=="toss")return;
    const left=Math.max(0,(S.endAt-now)/1000);
    $("timefill").style.transform=`scaleX(${left/S.time})`;$("timebar").classList.toggle("low",left<=10);
    const sec=Math.ceil(left);if(sec!==S.lastSec){S.lastSec=sec;$("timeTxt").textContent=`剩下 ${sec} 秒`;if(sec<=5&&sec>0)sfx.tick()}
    if(left<=0)return finish();
    raf=requestAnimationFrame(tick);
  }
  function start(){
    unlock();$("start").hidden=true;$("end").hidden=true;
    S.score=0;S.miss=0;S.lastSec=-1;S.last="";$("score").textContent="⭐ 0";$("shelves").innerHTML="";
    $("timefill").style.transform="scaleX(1)";$("timebar").classList.remove("low");$("timeTxt").textContent=`${S.time} 秒`;
    S.phase="count";const cnt=$("count");let n=3;cnt.hidden=false;cnt.textContent=n;sfx.tick();
    const iv=setInterval(()=>{n--;if(n>0){cnt.textContent=n;sfx.tick();return}
      clearInterval(iv);cnt.hidden=true;sfx.go();S.phase="play";S.endAt=performance.now()+S.time*1000;setQ();
      cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)},800);
    try{navigator.wakeLock?.request("screen").catch(()=>{})}catch(e){}
  }
  function finish(){
    S.phase="end";cancelAnimationFrame(raf);sfx.end();document.querySelectorAll(".ring").forEach(r=>r.remove());
    $("timefill").style.transform="scaleX(0)";$("timeTxt").textContent="時間到";
    const best=getBest(),rec=S.score>best;if(rec)pref(bestKey(),S.score);
    $("result").innerHTML=`${S.score}<small> 個</small>`;$("newrec").hidden=!rec||S.score===0;
    $("endText").textContent=`${LV[S.lv].name}・${S.time} 秒　最佳成績：${Math.max(best,S.score)} 個`+(S.miss?`（丟歪 ${S.miss} 次）`:"");
    $("end").hidden=false;syncSetup();
    say(rec&&S.score?`新紀錄！套中${S.score}個`:`時間到！套中${S.score}個`);
  }
  $("go").addEventListener("click",start);$("replay").addEventListener("click",start);
  $("change").addEventListener("click",()=>{$("end").hidden=true;$("start").hidden=false;S.phase="start"});
})();
</script>
</body>
</html>
